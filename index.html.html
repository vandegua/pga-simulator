<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGA Tournament Simulator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body,#root{height:100%;width:100%}
  body{background:#0a0e17;color:#e2e8f0;font-family:'JetBrains Mono','SF Mono','Fira Code',monospace}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:#1e293b;border-radius:2px;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#22d3ee;cursor:pointer;border:2px solid #0a0e17}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#22d3ee;cursor:pointer;border:2px solid #0a0e17}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#0a0e17}
  ::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
  ::selection{background:#22d3ee33}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;

const DG_BASE="https://feeds.datagolf.com";
const SIM_COUNTS=[1000,5000,10000,25000,50000];
const MARKETS=["win","top_5","top_10","top_20","make_cut"];
const MARKET_LABELS={win:"Win",top_5:"Top 5",top_10:"Top 10",top_20:"Top 20",make_cut:"Make Cut"};
const ROUND_STDEV=2.8;
const KNOWN_BOOKS=["draftkings"];
const PROXIES=[
  {name:"corsproxy.io",fn:u=>`https://corsproxy.io/?${encodeURIComponent(u)}`},
  {name:"allorigins",fn:u=>`https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`},
  {name:"corsproxy.org",fn:u=>`https://corsproxy.org/?${encodeURIComponent(u)}`},
  {name:"Direct",fn:u=>u},
];

const normalRandom=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const decToImp=o=>(o&&o>1)?1/o:0;
const pFmt=v=>v!=null?(v*100).toFixed(2)+"%":"-";
const evFmt=v=>{if(v==null)return"-";const s=(v*100).toFixed(1);return v>0?"+"+s+"%":s+"%";};

// localStorage helpers (replaces window.storage from Claude artifacts)
const sGet=k=>{try{const v=localStorage.getItem("pga_"+k);return v?JSON.parse(v):null;}catch{return null;}};
const sSet=(k,v)=>{try{localStorage.setItem("pga_"+k,JSON.stringify(v));}catch{}};

const dgFetch=async(path,params,pi)=>{
  const url=new URL(`${DG_BASE}${path}`);
  Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));
  url.searchParams.set("file_format","json");
  const raw=url.toString(),proxied=PROXIES[pi]?.fn(raw)||raw;
  const ctrl=new AbortController();const t=setTimeout(()=>ctrl.abort(),12000);
  try{const r=await fetch(proxied,{signal:ctrl.signal,headers:{Accept:"application/json"}});clearTimeout(t);if(!r.ok)throw new Error(`${r.status}`);const d=await r.json();return d?.contents?JSON.parse(d.contents):d;}
  catch(e){clearTimeout(t);throw e;}
};

const findArr=d=>{
  if(Array.isArray(d))return d;
  if(typeof d!=="object"||!d)return null;
  for(const k of Object.keys(d)){if(Array.isArray(d[k])&&d[k].length>0&&typeof d[k][0]==="object")return d[k];}
  const v=Object.values(d);if(v.length>5&&v.every(x=>typeof x==="object"&&x&&!Array.isArray(x)))return v;
  return null;
};

const runSim=(players,weights,n)=>{
  if(!players.length)return[];
  const st=weights.sg_ott+weights.sg_app+weights.sg_arg+weights.sg_putt;
  const w=st>0?{o:weights.sg_ott/st,a:weights.sg_app/st,g:weights.sg_arg/st,p:weights.sg_putt/st}:{o:.25,a:.25,g:.25,p:.25};
  const skills=players.map(p=>{
    const userSG=p.sg_ott*w.o+p.sg_app*w.a+p.sg_arg*w.g+p.sg_putt*w.p;
    const eqSG=(p.sg_ott+p.sg_app+p.sg_arg+p.sg_putt)*0.25;
    const base=(p.baseline||0)+(userSG-eqSG);
    return base+(p.course_history_adj||0)*weights.course_history+(p.course_fit_adj||0)*weights.course_fit+(p.recent_form_adj||0)*weights.recent_form;
  });
  const res=players.map(()=>({w:0,t5:0,t10:0,t20:0,mc:0,tp:0}));
  for(let s=0;s<n;s++){
    const sc=skills.map(sk=>{let t=0;for(let r=0;r<4;r++)t+=-(sk+normalRandom()*ROUND_STDEV);return t;});
    const ix=sc.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);
    let pos=1;
    for(let j=0;j<ix.length;){let k=j;while(k<ix.length&&Math.abs(ix[k].v-ix[j].v)<.001)k++;const avg=(pos+pos+k-j-1)/2;for(let m=j;m<k;m++){const pi=ix[m].i;res[pi].tp+=avg;if(avg<=1)res[pi].w++;if(avg<=5)res[pi].t5++;if(avg<=10)res[pi].t10++;if(avg<=20)res[pi].t20++;if(avg<=65)res[pi].mc++;}pos+=k-j;j=k;}
  }
  return players.map((p,i)=>({...p,sim_win:res[i].w/n,sim_top5:res[i].t5/n,sim_top10:res[i].t10/n,sim_top20:res[i].t20/n,sim_make_cut:res[i].mc/n,avg_finish:res[i].tp/n}));
};

function App(){
  const [tab,setTab]=useState("setup");
  const [apiKey,setApiKey]=useState("");
  const [apiKeyInp,setApiKeyInp]=useState("");
  const [loading,setLoading]=useState(false);
  const [fetchSt,setFetchSt]=useState("");
  const [error,setError]=useState(null);
  const [ds,setDs]=useState({decomp:null,preds:null,skills:null,odds:{}});
  const [tourney,setTourney]=useState(null);
  const [players,setPlayers]=useState([]);
  const [sgW,setSgW]=useState({ott:20,app:30,arg:25,putt:25});
  const [ctxW,setCtxW]=useState({ch:100,cf:100,rf:100});
  const [simCount,setSimCount_]=useState(10000);
  const [simRes,setSimRes]=useState(null);
  const [simRunning,setSimRunning]=useState(false);
  const [presets,setPresets]=useState([]);
  const [pName,setPName]=useState("");
  const [hist,setHist]=useState([]);
  const [sort,setSort]=useState({col:"sim_win",dir:"desc"});
  const [evS,setEvS]=useState({col:"ev_win",dir:"desc"});

  useEffect(()=>{
    const k=sGet("dg_key");if(k){setApiKey(k);setApiKeyInp(k);}
    const p=sGet("presets");if(p)setPresets(p);
    const h=sGet("hist");if(h)setHist(h);
    const sg=sGet("sgW");if(sg)setSgW(sg);
    const cx=sGet("ctxW");if(cx)setCtxW(cx);
  },[]);
  useEffect(()=>{sSet("sgW",sgW);},[sgW]);
  useEffect(()=>{sSet("ctxW",ctxW);},[ctxW]);

  const saveKey=()=>{const k=apiKeyInp.trim();setApiKey(k);sSet("dg_key",k);setError(null);};

  const mergeAll=useCallback((decomp,preds,skills,odds,ti)=>{
    const da=findArr(decomp)||[],pa=findArr(preds)||[],sa=findArr(skills)||[];
    const mk=a=>{const m={};a.forEach(p=>{const k=p.dg_id||p.player_name;if(k)m[k]=p;});return m;};
    const pm=mk(pa),sm=mk(sa);
    const om={};
    Object.entries(odds||{}).forEach(([mkt,d])=>{om[mkt]={};(findArr(d)||[]).forEach(p=>{const k=p.dg_id||p.player_name;if(k)om[mkt][k]=p;});});
    const src=da.length?da:pa.length?pa:[];
    const merged=src.map(p=>{
      const id=p.dg_id||p.player_name;if(!id)return null;
      const sk=sm[id]||{},pr=pm[id]||{};
      const sg_ott=(p.driving_accuracy_adjustment||0)+(p.driving_distance_adjustment||0)||p.driving||sk.sg_ott||0;
      const sg_app=p.cf_approach_comp??p.approach??sk.sg_app??0;
      const sg_arg=p.cf_short_comp??p.around_the_green??sk.sg_arg??0;
      const sg_putt=p.putting_adjustment??p.putting??sk.sg_putt??0;
      const baseline=p.baseline_pred||0;
      const ch=p.course_history_adjustment||p.course_experience_adjustment||0;
      const cf=p.total_fit_adjustment||0;
      const rf=p.true_sg_adjustments||0;
      const playerOdds={};
      MARKETS.forEach(mkt=>{
        const od=om[mkt]?.[id];if(!od)return;
        let best=0,bBook="";
        Object.entries(od).forEach(([k,v])=>{if(typeof v==="number"&&v>1&&KNOWN_BOOKS.some(b=>k.toLowerCase().replace(/[\s_]/g,"").includes(b.replace(/[\s_]/g,"")))){if(v>best){best=v;bBook=k;}}});
        const dgP=od.dg_prob||od.datagolf_base_history_fit||0;
        if(best>1)playerOdds[mkt]={bestOdds:best,bestBook:bBook,dgProb:dgP};
      });
      return{id,name:p.player_name||p.name||String(id),country:p.country||"",sg_ott,sg_app,sg_arg,sg_putt,baseline,course_history_adj:ch,course_fit_adj:cf,recent_form_adj:rf,dg_win:pr.win||0,dg_top5:pr.top_5||0,dg_top10:pr.top_10||0,dg_top20:pr.top_20||0,dg_make_cut:pr.make_cut||0,playerOdds};
    }).filter(p=>p&&(Math.abs(p.baseline)>0.001||p.dg_win>0||Math.abs(p.sg_ott+p.sg_app+p.sg_arg+p.sg_putt)>0.001));
    setPlayers(merged);
    if(ti)setTourney(ti);
  },[]);

  const fetchAll=async(pi=0)=>{
    if(!apiKey){setError("Save API key first.");return;}
    setLoading(true);setError(null);setFetchSt(`Trying ${PROXIES[pi]?.name}...`);
    const f=(path,par)=>dgFetch(path,par,pi),par={key:apiKey,tour:"pga"};
    try{
      setFetchSt(`[${PROXIES[pi]?.name}] Field...`);
      const field=await f("/field-updates",par);
      const ti={name:field?.event_name||"Tournament",course:field?.course||""};
      setFetchSt(`[${PROXIES[pi]?.name}] Decompositions...`);
      const decomp=await f("/preds/player-decompositions",par);
      setFetchSt(`[${PROXIES[pi]?.name}] Predictions...`);
      const preds=await f("/preds/pre-tournament",{...par,odds_format:"percent"});
      setFetchSt(`[${PROXIES[pi]?.name}] Skills...`);
      const skills=await f("/preds/skill-ratings",{...par,display:"value"});
      setFetchSt(`[${PROXIES[pi]?.name}] Odds...`);
      const odds={};
      await Promise.all(MARKETS.map(async m=>{try{odds[m]=await f("/betting-tools/outrights",{...par,market:m,odds_format:"decimal"});}catch{}}));
      const newDs={decomp,preds,skills,odds};
      setDs(newDs);mergeAll(decomp,preds,skills,odds,ti);
      setFetchSt("");setTab("weights");
    }catch(e){
      if(pi<PROXIES.length-1){setLoading(false);return fetchAll(pi+1);}
      setError("All proxies failed. Use Quick Import below.");setFetchSt("");
    }
    setLoading(false);
  };

  const handleImport=(text)=>{
    try{
      const raw=JSON.parse(text.trim());const arr=findArr(raw);
      const meta=!Array.isArray(raw)&&typeof raw==="object"?raw:{};
      if(!arr||!arr.length)return{ok:false,msg:`No array found. Keys: ${typeof raw==="object"?Object.keys(raw).slice(0,6).join(", "):"N/A"}`};
      const s=arr[0];let type,label;
      if(s.baseline_pred!==undefined||s.driving_accuracy_adjustment!==undefined||s.cf_approach_comp!==undefined||s.total_fit_adjustment!==undefined){type="decomp";label=`Decompositions (${arr.length})`;}
      else if(s.win!==undefined&&s.make_cut!==undefined&&s.baseline_pred===undefined&&s.dg_prob===undefined){type="preds";label=`Predictions (${arr.length})`;}
      else if(s.sg_total!==undefined||(s.sg_ott!==undefined&&s.baseline_pred===undefined)){type="skills";label=`Skill Ratings (${arr.length})`;}
      else if(s.dg_prob!==undefined||s.datagolf_base_history_fit!==undefined||Object.keys(s).some(k=>KNOWN_BOOKS.some(b=>k.toLowerCase().includes(b)))){type="odds";label=`Odds (${arr.length})`;}
      else if(s.player_name||s.dg_id){type="decomp";label=`Player data (${arr.length})`;}
      else return{ok:false,msg:`Unknown format. Fields: ${Object.keys(s).slice(0,8).join(", ")}`};
      const nds={...ds};
      const ti={name:meta.event_name||meta.tournament||tourney?.name||"Imported",course:meta.course||tourney?.course||"Manual"};
      if(type==="decomp")nds.decomp=arr;
      else if(type==="preds")nds.preds=arr;
      else if(type==="skills")nds.skills=arr;
      else if(type==="odds"){let mkt="win";if(meta.market)mkt=meta.market;nds.odds={...nds.odds,[mkt]:arr};}
      setDs(nds);mergeAll(nds.decomp,nds.preds,nds.skills,nds.odds,ti);
      return{ok:true,msg:`✓ ${label}`,type};
    }catch(e){return{ok:false,msg:`Invalid JSON: ${e.message}`};}
  };

  const adjSG=(field,val)=>{
    const c={...sgW};const old=c[field];const diff=val-old;
    const oth=Object.keys(c).filter(k=>k!==field);
    const othSum=oth.reduce((s,k)=>s+c[k],0);
    if(othSum===0){c[field]=Math.min(100,Math.max(0,val));}
    else{c[field]=val;oth.forEach(k=>{c[k]=Math.max(0,Math.round(c[k]-diff*(c[k]/othSum)));});
    const tot=Object.values(c).reduce((s,v)=>s+v,0);
    if(tot!==100){const lg=oth.sort((a,b)=>c[b]-c[a])[0];c[lg]+=100-tot;}}
    setSgW(c);
  };

  const doSim=useCallback(async()=>{
    if(!players.length)return;
    setSimRunning(true);await new Promise(r=>setTimeout(r,50));
    const w={sg_ott:sgW.ott/100,sg_app:sgW.app/100,sg_arg:sgW.arg/100,sg_putt:sgW.putt/100,course_history:ctxW.ch/100,course_fit:ctxW.cf/100,recent_form:ctxW.rf/100};
    const r=runSim(players,w,simCount);
    setSimRes(r);setSimRunning(false);setTab("results");
    const e={id:Date.now(),date:new Date().toISOString(),t:tourney?.name,n:simCount,sg:sgW,cx:ctxW,top:r.sort((a,b)=>b.sim_win-a.sim_win).slice(0,5).map(p=>({n:p.name,w:p.sim_win}))};
    const h=[e,...hist].slice(0,20);setHist(h);sSet("hist",h);
  },[players,sgW,ctxW,simCount,tourney,hist]);

  const savePre=()=>{if(!pName.trim())return;const p={name:pName.trim(),sg:sgW,cx:ctxW};const u=[...presets.filter(x=>x.name!==p.name),p];setPresets(u);sSet("presets",u);setPName("");};

  const sorted=useMemo(()=>{if(!simRes)return[];return[...simRes].sort((a,b)=>{const av=a[sort.col]??0,bv=b[sort.col]??0;return sort.dir==="desc"?bv-av:av-bv;});},[simRes,sort]);

  const evData=useMemo(()=>{
    if(!simRes)return[];
    const smk={win:"sim_win",top_5:"sim_top5",top_10:"sim_top10",top_20:"sim_top20",make_cut:"sim_make_cut"};
    return simRes.map(p=>{
      const ev={};
      MARKETS.forEach(m=>{
        const od=p.playerOdds?.[m];
        if(od?.bestOdds>1){
          const imp=decToImp(od.bestOdds);
          ev[`ev_${m}`]=(p[smk[m]]||0)-imp;
          ev[`sim_${m}`]=p[smk[m]]||0;
          ev[`imp_${m}`]=imp;
          ev[`odds_${m}`]=od.bestOdds;
          ev[`book_${m}`]=od.bestBook;
        }
      });
      return{...p,...ev};
    }).sort((a,b)=>{const av=a[evS.col]??-999,bv=b[evS.col]??-999;return evS.dir==="desc"?bv-av:av-bv;});
  },[simRes,evS]);

  const dSt={
    decomp:!!(findArr(ds.decomp)?.length),
    preds:!!(findArr(ds.preds)?.length),
    skills:!!(findArr(ds.skills)?.length),
    odds:Object.keys(ds.odds||{}).filter(k=>(findArr(ds.odds[k])||[]).length>0),
  };
  const hasOdds=dSt.odds.length>0;
  const tSort=(col,def="desc")=>{setSort(s=>s.col===col?{...s,dir:s.dir==="desc"?"asc":"desc"}:{col,dir:def});};

  return (
    <div style={S.root}>
      <div style={S.header}><div style={S.hL}><div style={S.logo}>◆</div><div><h1 style={S.title}>PGA Tournament Simulator</h1><div style={S.sub}>{tourney?`${tourney.name} · ${tourney.course}`:"Monte Carlo Simulation Engine"}</div></div></div>
      <div style={S.badges}>{players.length>0&&<span style={S.badge}>{players.length} players</span>}{simRes&&<span style={S.badge}>{simCount.toLocaleString()} sims</span>}</div></div>

      <div style={S.tabs}>
        {[["setup","⚙","Setup",true],["weights","⚖","Weights",players.length>0],["simulate","▶","Simulate",players.length>0],["results","📊","Results",!!simRes],["ev","💰","EV Analysis",!!simRes],["history","🕐","History",true]].map(([id,ic,lb,en])=>(
          <button key={id} disabled={!en} onClick={()=>setTab(id)} style={{...S.tab,...(tab===id?S.tabOn:{}),... (!en?S.tabOff:{})}}><span style={{marginRight:4}}>{ic}</span>{lb}</button>
        ))}
      </div>

      {error&&<div style={S.err}><b>⚠</b> {error}</div>}

      {tab==="setup"&&<div style={S.panel}>
        <h2 style={S.h2}>API Configuration</h2>
        <div style={S.row}><input type="password" value={apiKeyInp} onChange={e=>setApiKeyInp(e.target.value)} placeholder="DataGolf API key..." style={S.inp}/><button onClick={saveKey} style={S.btnP}>Save Key</button></div>
        {apiKey&&<div style={S.ok}>✓ Key saved</div>}
        <button onClick={()=>fetchAll(0)} disabled={!apiKey||loading} style={{...S.btnBig,marginTop:14,opacity:(!apiKey||loading)?0.5:1}}>{loading?`⏳ ${fetchSt}`:"🔄 Fetch Current Tournament Data"}</button>

        <div style={{...S.dv,margin:"22px 0 14px"}}/>
        <h2 style={S.h2}>Data Import Dashboard</h2>
        <p style={S.help}>Each row shows whether that dataset is loaded. Green = ready. Click "Open" to get the JSON from DataGolf, then paste below.</p>

        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          {[
            {key:"decomp",label:"Player Decompositions",req:true,on:dSt.decomp,desc:"SG components, baseline_pred, course_history_adjustment, total_fit_adjustment, true_sg_adjustments",path:"/preds/player-decompositions?tour=pga"},
            {key:"preds",label:"Pre-Tournament Predictions",on:dSt.preds,desc:"DG model probabilities: win, top 5/10/20, make cut",path:"/preds/pre-tournament?tour=pga&odds_format=percent"},
            {key:"skills",label:"Skill Ratings",on:dSt.skills,desc:"Overall SG ratings per category per player",path:"/preds/skill-ratings?display=value"},
            {key:"odds_win",label:"Odds — Win",on:dSt.odds.includes("win"),desc:"DraftKings outright win odds + DG probabilities → EV analysis",path:"/betting-tools/outrights?tour=pga&market=win&odds_format=decimal"},
            {key:"odds_t5",label:"Odds — Top 5",on:dSt.odds.includes("top_5"),desc:"DraftKings Top 5 finish odds",path:"/betting-tools/outrights?tour=pga&market=top_5&odds_format=decimal"},
            {key:"odds_t10",label:"Odds — Top 10",on:dSt.odds.includes("top_10"),desc:"DraftKings Top 10 finish odds",path:"/betting-tools/outrights?tour=pga&market=top_10&odds_format=decimal"},
            {key:"odds_t20",label:"Odds — Top 20",on:dSt.odds.includes("top_20"),desc:"DraftKings Top 20 finish odds",path:"/betting-tools/outrights?tour=pga&market=top_20&odds_format=decimal"},
          ].map(d=>(
            <div key={d.key} style={{...S.stRow,borderLeft:`3px solid ${d.on?"#22c55e":d.req?"#f59e0b":"#334155"}`}}>
              <div style={{flex:1}}>
                <span style={{color:d.on?"#22c55e":"#64748b",fontWeight:600,fontSize:12}}>{d.on?"✓":"○"} {d.label}{d.req&&!d.on&&<span style={{color:"#f59e0b",fontSize:9,marginLeft:5}}>REQUIRED</span>}</span>
                <div style={{fontSize:10,color:"#475569",marginTop:1}}>{d.desc}</div>
              </div>
              {apiKey&&!d.on&&<button onClick={()=>window.open(`${DG_BASE}${d.path}&file_format=json&key=${apiKey}`,"_blank")} style={S.btnSm}>Open ↗</button>}
            </div>
          ))}
        </div>

        <div style={{marginTop:14}}><PasteBox onImport={handleImport}/></div>
        {players.length>0&&<div style={S.loadBar}><span>✓ {players.length} players loaded</span><button onClick={()=>setTab("weights")} style={S.btnP}>Weights →</button></div>}

        <div style={{...S.dv,margin:"22px 0"}}/>
        <h3 style={S.h3}>Data Flow</h3>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(190px,1fr))",gap:8}}>
          {[
            {i:"📡",t:"Decompositions",d:"Per-player SG breakdown, baseline skill, course history/fit adjustments, and form adjustments from DataGolf."},
            {i:"⚖️",t:"Your Weights",d:"SG sliders (always sum to 100%) shift emphasis. Context sliders (0-200%) amplify/dampen DG adjustments."},
            {i:"🎲",t:"Monte Carlo",d:"Each sim: player_skill + noise (σ=2.8/round) × 4 rounds. Rank, assign positions with ties."},
            {i:"💰",t:"EV Analysis",d:"Sim probability − DraftKings implied probability. Positive = potential edge."},
          ].map(c=>(<div key={c.t} style={S.flowC}><div style={{fontSize:18,marginBottom:4}}>{c.i}</div><div style={{fontSize:11,fontWeight:700,color:"#e2e8f0",marginBottom:3}}>{c.t}</div><div style={{fontSize:10,color:"#64748b",lineHeight:1.4}}>{c.d}</div></div>))}
        </div>
      </div>}

      {tab==="weights"&&<div style={S.panel}>
        <div style={{display:"grid",gridTemplateColumns:"1fr 250px",gap:18}}>
          <div>
            <h2 style={S.h2}>Strokes Gained Weights <span style={{fontSize:11,color:"#64748b",fontWeight:400}}>(linked — always sum to 100%)</span></h2>
            <p style={S.help}>Drag any slider — the others auto-adjust proportionally to maintain 100% total.</p>
            {[{k:"ott",l:"SG: Off the Tee",d:"Driving distance & accuracy"},{k:"app",l:"SG: Approach",d:"Iron play, proximity"},{k:"arg",l:"SG: Around Green",d:"Chipping, bunkers"},{k:"putt",l:"SG: Putting",d:"Green reading, stroke"}].map(s=>(
              <div key={s.k} style={S.slG}><div style={S.slH}><span style={S.slL}>{s.l}</span><span style={S.slV}>{sgW[s.k]}%</span></div><div style={{fontSize:10,color:"#64748b",marginBottom:3}}>{s.d}</div><input type="range" min={0} max={100} value={sgW[s.k]} onChange={e=>adjSG(s.k,+e.target.value)} style={S.slider}/></div>
            ))}
            <div style={{padding:"8px 12px",background:"#0f172a",borderRadius:5,marginTop:4,fontSize:11,color:"#94a3b8"}}>Total: <b style={{color:Object.values(sgW).reduce((a,b)=>a+b,0)===100?"#22c55e":"#ef4444"}}>{Object.values(sgW).reduce((a,b)=>a+b,0)}%</b></div>

            <div style={{...S.dv,margin:"20px 0"}}/>
            <h2 style={S.h2}>Contextual Adjustment Multipliers <span style={{fontSize:11,color:"#64748b",fontWeight:400}}>(0% = off, 100% = full DG value, 200% = doubled)</span></h2>
            <p style={S.help}>These amplify or dampen the adjustment values DataGolf provides in the decompositions endpoint.</p>
            {[
              {k:"ch",l:"Course History",d:"DG field: course_history_adjustment — past results at this course"},
              {k:"cf",l:"Course Fit",d:"DG field: total_fit_adjustment — skill profile vs course demands"},
              {k:"rf",l:"Recent Form",d:"DG field: true_sg_adjustments — trending performance / timing"},
            ].map(s=>(
              <div key={s.k} style={S.slG}><div style={S.slH}><span style={S.slL}>{s.l}</span><span style={S.slV}>{ctxW[s.k]}%</span></div><div style={{fontSize:10,color:"#64748b",marginBottom:3}}>{s.d}</div><input type="range" min={0} max={200} value={ctxW[s.k]} onChange={e=>setCtxW(w=>({...w,[s.k]:+e.target.value}))} style={S.slider}/></div>
            ))}
          </div>

          <div style={S.side}>
            <h3 style={S.h3}>Saved Presets</h3>
            <div style={{display:"flex",gap:4,marginBottom:8}}><input value={pName} onChange={e=>setPName(e.target.value)} placeholder="Name..." style={{...S.inp,fontSize:11,padding:"5px 8px"}}/><button onClick={savePre} disabled={!pName.trim()} style={{...S.btnSm,opacity:pName.trim()?1:0.4}}>Save</button></div>
            {presets.map(p=>(<div key={p.name} style={{display:"flex",gap:3,marginBottom:3}}><button onClick={()=>{setSgW(p.sg);setCtxW(p.cx);}} style={S.preBtn}>{p.name}</button><button onClick={()=>{const u=presets.filter(x=>x.name!==p.name);setPresets(u);sSet("presets",u);}} style={S.preDel}>✕</button></div>))}
            {!presets.length&&<div style={S.empty}>No presets yet</div>}
            <div style={{...S.dv,margin:"12px 0"}}/>
            <h3 style={S.h3}>Quick Profiles</h3>
            {[
              {n:"Balanced",sg:{ott:25,app:25,arg:25,putt:25},cx:{ch:100,cf:100,rf:100}},
              {n:"Ball Striker",sg:{ott:30,app:40,arg:15,putt:15},cx:{ch:100,cf:120,rf:100}},
              {n:"Scrambler",sg:{ott:10,app:20,arg:35,putt:35},cx:{ch:100,cf:100,rf:100}},
              {n:"Approach Heavy",sg:{ott:15,app:45,arg:20,putt:20},cx:{ch:100,cf:130,rf:100}},
              {n:"Course Horse",sg:{ott:25,app:25,arg:25,putt:25},cx:{ch:180,cf:150,rf:80}},
              {n:"Hot Hand",sg:{ott:25,app:25,arg:25,putt:25},cx:{ch:60,cf:60,rf:180}},
            ].map(q=>(<button key={q.n} onClick={()=>{setSgW(q.sg);setCtxW(q.cx);}} style={S.qpBtn}>{q.n}</button>))}
          </div>
        </div>
      </div>}

      {tab==="simulate"&&<div style={S.panel}>
        <h2 style={S.h2}>Run Simulation</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18,marginBottom:18}}>
          <div><label style={S.label}>Iterations</label><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{SIM_COUNTS.map(c=>(<button key={c} onClick={()=>setSimCount_(c)} style={{...S.simBtn,...(simCount===c?S.simBtnOn:{})}}>{c.toLocaleString()}</button>))}</div></div>
          <div style={S.cfgBox}><h3 style={S.h3}>Config</h3><div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5}}>{[["Players",players.length],["Sims",simCount.toLocaleString()],["OTT",sgW.ott+"%"],["APP",sgW.app+"%"],["ARG",sgW.arg+"%"],["PUTT",sgW.putt+"%"],["Hx",ctxW.ch+"%"],["Fit",ctxW.cf+"%"],["Form",ctxW.rf+"%"]].map(([l,v])=>(<div key={l}><div style={{fontSize:8,color:"#64748b",textTransform:"uppercase"}}>{l}</div><div style={{fontSize:12,fontWeight:700,color:"#e2e8f0"}}>{v}</div></div>))}</div></div>
        </div>
        <button onClick={doSim} disabled={simRunning||!players.length} style={{...S.btnRun,opacity:(simRunning||!players.length)?0.6:1}}>{simRunning?"⏳ Running...":`▶ Run ${simCount.toLocaleString()} Simulations`}</button>
      </div>}

      {tab==="results"&&simRes&&<div style={S.panel}>
        <h2 style={S.h2}>Simulation Results</h2>
        <p style={S.help}>{simCount.toLocaleString()} sims · Click headers to sort</p>
        <div style={S.tW}><table style={S.table}><thead><tr>
          <th style={S.th}>#</th>
          <th style={{...S.th,textAlign:"left",cursor:"pointer"}} onClick={()=>tSort("name","asc")}>Player</th>
          {[["sim_win","Win%"],["sim_top5","Top 5"],["sim_top10","Top 10"],["sim_top20","Top 20"],["sim_make_cut","Cut"],["avg_finish","Avg Pos"],["dg_win","DG Win%"]].map(([c,l])=>(
            <th key={c} style={{...S.th,cursor:"pointer"}} onClick={()=>tSort(c,c==="avg_finish"?"asc":"desc")}>{l} {sort.col===c?(sort.dir==="asc"?"↑":"↓"):""}</th>
          ))}
        </tr></thead><tbody>
          {sorted.slice(0,80).map((p,i)=>(<tr key={p.id} style={i%2?S.trO:S.trE}>
            <td style={S.tdR}>{i+1}</td><td style={S.tdN}>{p.name}</td>
            <td style={S.tdH}>{pFmt(p.sim_win)}</td><td style={S.td}>{pFmt(p.sim_top5)}</td><td style={S.td}>{pFmt(p.sim_top10)}</td><td style={S.td}>{pFmt(p.sim_top20)}</td><td style={S.td}>{pFmt(p.sim_make_cut)}</td><td style={S.td}>{p.avg_finish?.toFixed(1)}</td><td style={S.tdD}>{p.dg_win>0?pFmt(p.dg_win):"-"}</td>
          </tr>))}
        </tbody></table></div>
      </div>}

      {tab==="ev"&&simRes&&<div style={S.panel}>
        <h2 style={S.h2}>Expected Value Analysis</h2>
        {!hasOdds&&<div style={S.warn}><b>No DraftKings odds loaded.</b> Import odds from DataGolf's betting-tools/outrights endpoint (Setup tab) to enable EV analysis.</div>}
        {hasOdds&&<React.Fragment>
          <p style={S.help}>EV = Sim% − DraftKings implied%. <span style={{color:"#22c55e"}}>Green = edge.</span> Markets loaded: <b>{dSt.odds.map(m=>MARKET_LABELS[m]).join(", ")}</b></p>
          <div style={S.tW}><table style={S.table}><thead><tr>
            <th style={S.th}>#</th><th style={{...S.th,textAlign:"left"}}>Player</th>
            {dSt.odds.flatMap(m=>[
              [`ev_${m}`,`${MARKET_LABELS[m]} EV`],[`sim_${m}`,"Sim%"],[`odds_${m}`,"DK Odds"]
            ]).map(([c,l])=>(
              <th key={c} style={{...S.th,cursor:"pointer",fontSize:8}} onClick={()=>setEvS(s=>s.col===c?{...s,dir:s.dir==="desc"?"asc":"desc"}:{col:c,dir:"desc"})}>{l}{evS.col===c?(evS.dir==="asc"?" ↑":" ↓"):""}</th>
            ))}
          </tr></thead><tbody>
            {evData.filter(p=>MARKETS.some(m=>p[`ev_${m}`]!=null)).slice(0,80).map((p,i)=>(<tr key={p.id} style={i%2?S.trO:S.trE}>
              <td style={S.tdR}>{i+1}</td><td style={S.tdN}>{p.name}</td>
              {dSt.odds.flatMap(m=>[
                <td key={`e${m}`} style={{...S.td,fontWeight:700,color:(p[`ev_${m}`]||0)>0.01?"#22c55e":(p[`ev_${m}`]||0)<-0.02?"#ef4444":"#94a3b8"}}>{evFmt(p[`ev_${m}`])}</td>,
                <td key={`s${m}`} style={S.td}>{pFmt(p[`sim_${m}`])}</td>,
                <td key={`o${m}`} style={S.td}>{p[`odds_${m}`]?p[`odds_${m}`].toFixed(1):"-"}</td>,
              ])}
            </tr>))}
          </tbody></table></div>
        </React.Fragment>}
      </div>}

      {tab==="history"&&<div style={S.panel}>
        <h2 style={S.h2}>Simulation History</h2>
        {!hist.length&&<div style={S.empty}>No simulations yet.</div>}
        {hist.map(h=>(<div key={h.id} style={S.hCard}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}><span style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{h.t}</span><span style={{fontSize:10,color:"#64748b"}}>{new Date(h.date).toLocaleString()}</span></div>
          <div style={{fontSize:10,color:"#64748b",marginBottom:5}}>{h.n?.toLocaleString()} sims · OTT:{h.sg?.ott}% APP:{h.sg?.app}% ARG:{h.sg?.arg}% PUTT:{h.sg?.putt}% · Hx:{h.cx?.ch}% Fit:{h.cx?.cf}% Form:{h.cx?.rf}%</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4}}>{h.top?.map((t,j)=>(<span key={j} style={S.hP}>{j+1}. {t.n} ({(t.w*100).toFixed(1)}%)</span>))}</div>
        </div>))}
      </div>}
    </div>
  );
}

function PasteBox({onImport}){
  const [t,setT]=useState("");
  const [st,setSt]=useState(null);
  const [log,setLog]=useState([]);
  const go=()=>{if(!t.trim())return;const r=onImport(t);setSt(r);if(r.ok){setLog(l=>[...l,r.msg]);setT("");}};
  return(<div>
    <label style={{fontSize:11,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.05em"}}>Paste JSON Data</label>
    <div style={{fontSize:10,color:"#64748b",marginBottom:4}}>Open endpoint → Ctrl+A → Ctrl+C → Paste here. Auto-detects type.</div>
    <div style={{position:"relative"}}><textarea value={t} onChange={e=>setT(e.target.value)} rows={4} placeholder="Paste DataGolf JSON..." style={{width:"100%",padding:"9px 11px",fontSize:11,fontFamily:"'JetBrains Mono',monospace",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:5,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
    {t.trim()&&<button onClick={go} style={{position:"absolute",bottom:8,right:8,padding:"4px 10px",fontSize:10,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer"}}>Import</button>}</div>
    {st&&<div style={{fontSize:11,marginTop:3,padding:"4px 7px",borderRadius:3,background:st.ok?"#0a2e1a":"#1c1117",color:st.ok?"#4ade80":"#fca5a5",border:`1px solid ${st.ok?"#166534":"#7f1d1d"}`}}>{st.msg}</div>}
    {log.length>0&&<div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:3}}>{log.map((l,i)=>(<span key={i} style={{fontSize:9,padding:"2px 5px",borderRadius:3,background:"#164e63",color:"#67e8f9"}}>{l}</span>))}</div>}
  </div>);
}

const S={
  root:{fontFamily:"'JetBrains Mono','SF Mono',monospace",background:"#0a0e17",color:"#e2e8f0",minHeight:"100vh"},
  header:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 18px",borderBottom:"1px solid #1e293b",background:"linear-gradient(180deg,#0f172a,#0a0e17)"},
  hL:{display:"flex",alignItems:"center",gap:10},logo:{fontSize:24,color:"#22d3ee",filter:"drop-shadow(0 0 6px rgba(34,211,238,0.4))"},
  title:{fontSize:16,fontWeight:700,margin:0,color:"#f1f5f9"},sub:{fontSize:10,color:"#64748b",marginTop:1},
  badges:{display:"flex",gap:5},badge:{fontSize:9,padding:"2px 7px",borderRadius:3,background:"#1e293b",color:"#94a3b8",border:"1px solid #334155"},
  tabs:{display:"flex",gap:2,padding:"5px 18px",background:"#0f172a",borderBottom:"1px solid #1e293b",overflowX:"auto"},
  tab:{padding:"6px 12px",fontSize:10,fontWeight:500,fontFamily:"inherit",background:"transparent",color:"#64748b",border:"none",borderRadius:4,cursor:"pointer",whiteSpace:"nowrap"},
  tabOn:{background:"#1e293b",color:"#22d3ee"},tabOff:{opacity:0.3,cursor:"not-allowed"},
  panel:{padding:"18px",maxWidth:1200,margin:"0 auto"},h2:{fontSize:14,fontWeight:700,margin:"0 0 5px",color:"#f1f5f9"},h3:{fontSize:11,fontWeight:600,margin:"0 0 6px",color:"#cbd5e1"},
  help:{fontSize:11,color:"#64748b",margin:"0 0 12px",lineHeight:1.5},label:{display:"block",fontSize:10,fontWeight:600,color:"#94a3b8",marginBottom:4,textTransform:"uppercase",letterSpacing:"0.05em"},
  row:{display:"flex",gap:6},inp:{flex:1,padding:"8px 10px",fontSize:12,fontFamily:"inherit",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:4,outline:"none"},
  ok:{fontSize:10,color:"#22c55e",marginTop:4},
  err:{margin:"8px 18px",padding:"8px 12px",background:"#1c1117",border:"1px solid #7f1d1d",borderRadius:4,fontSize:11,color:"#fca5a5"},
  warn:{marginBottom:12,padding:"10px 14px",background:"#1a1a0e",border:"1px solid #854d0e",borderRadius:5,fontSize:11,color:"#fbbf24",lineHeight:1.5},
  dv:{height:1,background:"#1e293b"},
  btnP:{padding:"8px 16px",fontSize:11,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:4,cursor:"pointer",whiteSpace:"nowrap"},
  btnSm:{padding:"4px 8px",fontSize:10,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer",whiteSpace:"nowrap"},
  btnBig:{width:"100%",padding:"12px 18px",fontSize:12,fontWeight:700,fontFamily:"inherit",background:"linear-gradient(135deg,#0891b2,#22d3ee)",color:"#0a0e17",border:"none",borderRadius:6,cursor:"pointer"},
  btnRun:{width:"100%",padding:"14px 18px",fontSize:14,fontWeight:700,fontFamily:"inherit",background:"linear-gradient(135deg,#059669,#22c55e)",color:"#0a0e17",border:"none",borderRadius:6,cursor:"pointer"},
  stRow:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"#0f172a",borderRadius:5},
  loadBar:{marginTop:12,padding:"8px 12px",background:"#0a2e1a",border:"1px solid #166534",borderRadius:5,display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:12,color:"#4ade80",fontWeight:600},
  flowC:{padding:12,background:"#0f172a",border:"1px solid #1e293b",borderRadius:6},
  side:{background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,padding:12},
  slG:{marginBottom:16},slH:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1},
  slL:{fontSize:12,fontWeight:600,color:"#e2e8f0"},slV:{fontSize:13,fontWeight:700,color:"#22d3ee",fontVariantNumeric:"tabular-nums",minWidth:36,textAlign:"right"},
  slider:{width:"100%"},
  preBtn:{flex:1,padding:"4px 7px",fontSize:10,fontFamily:"inherit",background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:3,cursor:"pointer",textAlign:"left"},
  preDel:{padding:"2px 5px",fontSize:10,fontFamily:"inherit",background:"transparent",color:"#64748b",border:"none",cursor:"pointer"},
  qpBtn:{display:"block",width:"100%",padding:"6px 7px",fontSize:10,fontFamily:"inherit",background:"#1e293b",color:"#cbd5e1",border:"1px solid #334155",borderRadius:3,cursor:"pointer",textAlign:"left",marginBottom:2},
  empty:{fontSize:10,color:"#475569",fontStyle:"italic",padding:"4px 0"},
  simBtn:{padding:"6px 12px",fontSize:11,fontWeight:500,fontFamily:"inherit",background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:4,cursor:"pointer"},
  simBtnOn:{background:"#164e63",color:"#22d3ee",borderColor:"#22d3ee"},
  cfgBox:{background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,padding:12},
  tW:{overflowX:"auto",border:"1px solid #1e293b",borderRadius:6},
  table:{width:"100%",borderCollapse:"collapse",fontSize:10,fontVariantNumeric:"tabular-nums"},
  th:{padding:"7px 9px",textAlign:"right",fontSize:8,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:"2px solid #1e293b",background:"#0f172a",position:"sticky",top:0,whiteSpace:"nowrap",userSelect:"none"},
  trE:{background:"#0a0e17"},trO:{background:"#0d1220"},
  td:{padding:"6px 9px",textAlign:"right",color:"#cbd5e1",borderBottom:"1px solid #111827",whiteSpace:"nowrap"},
  tdR:{padding:"6px 9px",textAlign:"center",color:"#475569",borderBottom:"1px solid #111827",fontSize:9,width:28},
  tdN:{padding:"6px 9px",textAlign:"left",color:"#f1f5f9",fontWeight:600,borderBottom:"1px solid #111827",whiteSpace:"nowrap"},
  tdH:{padding:"6px 9px",textAlign:"right",color:"#22d3ee",fontWeight:700,borderBottom:"1px solid #111827"},
  tdD:{padding:"6px 9px",textAlign:"right",color:"#475569",borderBottom:"1px solid #111827"},
  hCard:{padding:"10px 12px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,marginBottom:6},
  hP:{fontSize:10,color:"#94a3b8",padding:"1px 5px",background:"#1e293b",borderRadius:3},
};

ReactDOM.render(<App/>,document.getElementById("root"));
</script>
</body>
</html>
