<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PGA Tournament Simulator v5.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body,#root{height:100%;width:100%}
body{background:#0a0e17;color:#e2e8f0;font-family:'JetBrains Mono','SF Mono','Fira Code',monospace}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;background:#1e293b;border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#22d3ee;cursor:pointer;border:2px solid #0a0e17}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#22d3ee;cursor:pointer;border:2px solid #0a0e17}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#0a0e17}::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
::selection{background:#22d3ee33}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo}=React;
const SENSITIVITY=4;
const DG_BASE="https://feeds.datagolf.com";
const WEATHER_KEY="f9747827ca9b4e7aa0b175947261303";
const DG_KEY_HIST="c741a29a2fdc66f8ff76ea573847";
const SIM_COUNTS=[1000,5000,10000,25000,50000];
const MARKETS=["win","top_5","top_10","top_20","make_cut"];
const MARKET_LABELS={win:"Win",top_5:"Top 5",top_10:"Top 10",top_20:"Top 20",make_cut:"Make Cut"};
const DEFAULT_SIGMA=3.0;const KNOWN_BOOKS=["draftkings","fanduel","betmgm","caesars","pinnacle","bet365","williamhill"];const PRIMARY_BOOK="draftkings";const MAX_STORE=15000;
const DEFAULT_MIN_EV={win:0.08,top_5:0.05,top_10:0.05,top_20:0.04,make_cut:0.03,matchup:0.03};
const OTT_DIST_RATIO=0.6;const OTT_ACC_RATIO=0.4;
const MIN_BASKET_ROUNDS=8;
const PROXIES=[
  {name:"corsproxy.io",fn:u=>"https://corsproxy.io/?"+encodeURIComponent(u)},
  {name:"allorigins",fn:u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u)},
  {name:"corsproxy.org",fn:u=>"https://corsproxy.org/?"+encodeURIComponent(u)},
  {name:"Direct",fn:u=>u},
];
const COURSE_SIM_COLS=[
  {c:"putt_sg",w:4},{c:"arg_sg",w:4},{c:"app_sg",w:4},{c:"ott_sg",w:4},
  {c:"fw_diff",w:2},{c:"rgh_diff",w:2},{c:"non_rgh_diff",w:1},{c:"miss_fw_pen_frac",w:2},
  {c:"less_150_sg",w:1},{c:"greater_150_sg",w:1},
  {c:"arg_fairway_sg",w:1},{c:"arg_rough_sg",w:1},{c:"arg_bunker_sg",w:1},
  {c:"less_5_ft_sg",w:1},{c:"greater_5_less_15_sg",w:1},{c:"greater_15_sg",w:1}
];
const SG_CATS=[{k:"sg_ott",l:"Off the Tee",sk:"dist"},{k:"sg_app",l:"Approach",sk:"app"},{k:"sg_arg",l:"Around Green",sk:"arg"},{k:"sg_putt",l:"Putting",sk:"putt"}];
const COURSE_SG_DISPLAY=[{k:"ott_sg",l:"Off the Tee"},{k:"app_sg",l:"Approach"},{k:"arg_sg",l:"Around Green"},{k:"putt_sg",l:"Putting"}];

/* ── helpers ── */
const normalRandom=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);};
const decToImp=o=>(o&&o>1)?1/o:0;
const pFmt=v=>v!=null?(v*100).toFixed(2)+"%":"-";
const pFmtS=v=>v!=null?(v*100).toFixed(1)+"%":"-";
const evFmt=v=>{if(v==null)return"-";const s=(v*100).toFixed(1);return v>0?"+"+s+"%":s+"%";};
const ci95=(p,n)=>n>0?1.96*Math.sqrt(Math.max(0,p*(1-p))/n):0;
const kellyBet=(sp,dec,frac,br)=>{if(!dec||dec<=1||sp<=0)return 0;const b=dec-1,q=1-sp,f=(b*sp-q)/b;return f>0?f*frac*br:0;};
/* ── de-vigging: normalize implied probabilities to sum to 1.0 ── */
const devigImplied=(players,mkt,oddsKey)=>{const impls=players.map(p=>{const od=p.playerOdds?.[mkt];return(od?.[oddsKey]>1)?decToImp(od[oddsKey]):0;});const sum=impls.reduce((a,b)=>a+b,0);if(sum<=0)return impls.map(()=>0);return impls.map(i=>i>0?i/sum:0);};
/* ── Matchup EV: p_win × (odds-1) - p_loss, where p_loss = 1 - p_win - p_tie ── */
const matchupEV=(p_win,odds,p_tie=0)=>{if(!odds||odds<=1||p_win==null)return null;const p_loss=Math.max(0,1-p_win-p_tie);return p_win*(odds-1)-p_loss;};
/* ── Bet qualification: true if lower-CI bound > implied (after devig) ── */
const qualifiesBet=(sp,n,impliedDevig,minEV)=>{if(sp==null||impliedDevig==null)return false;const ci=ci95(sp,n);const lowerBound=Math.max(0,sp-ci);const edge=lowerBound-impliedDevig;return edge>=minEV;};
const downloadCSV=(rows,fname)=>{if(!rows.length)return;const hdrs=Object.keys(rows[0]);const csv=[hdrs.join(","),...rows.map(r=>hdrs.map(h=>{const v=r[h];return typeof v==="string"&&v.includes(",")?"\""+v+"\"":v??""}).join(","))].join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=fname;a.click();};
const sGet=k=>{try{const v=localStorage.getItem("pga3_"+k);return v?JSON.parse(v):null;}catch{return null;}};
const sSet=(k,v)=>{try{localStorage.setItem("pga3_"+k,JSON.stringify(v));}catch{}};
const fmtEventLabel=(ev)=>{const name=ev.event_name||ev.event_id||"Unknown";const sd=ev.start_date||ev.date;if(sd){try{const d=new Date(sd+"T12:00:00");if(!isNaN(d)){return name+" "+d.toLocaleDateString("en",{month:"short"})+" "+d.getFullYear();}}catch{}}return name+" — "+(ev.calendar_year||"");};
const parseCSV=(text)=>{const lines=text.split(/\r?\n/).filter(l=>l.trim());if(lines.length<2)return[];const hdr=lines[0].split(",").map(h=>h.replace(/"/g,"").trim());return lines.slice(1).map(line=>{const vals=[];let cur="",inQ=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){inQ=!inQ;}else if(c===","&&!inQ){vals.push(cur);cur="";}else{cur+=c;}}vals.push(cur);const obj={};hdr.forEach((h,i)=>{const v=vals[i]?.trim();obj[h]=isNaN(v)||v===""?v:parseFloat(v);});return obj;});};

/* ── course similarity ── */
const cosineSim=(a,b,weights)=>{let dot=0,ma=0,mb=0;for(let i=0;i<a.length;i++){const wt=weights?weights[i]:1;dot+=a[i]*b[i]*wt;ma+=a[i]*a[i]*wt;mb+=b[i]*b[i]*wt;}return(ma&&mb)?dot/(Math.sqrt(ma)*Math.sqrt(mb)):0;};
const buildCourseVecs=(courses)=>{const cols=COURSE_SIM_COLS.map(x=>x.c);const weights=COURSE_SIM_COLS.map(x=>x.w);const mins={},maxs={};cols.forEach(c=>{mins[c]=Infinity;maxs[c]=-Infinity;});courses.forEach(cr=>{cols.forEach(c=>{const v=cr[c];if(typeof v==="number"&&!isNaN(v)){mins[c]=Math.min(mins[c],v);maxs[c]=Math.max(maxs[c],v);}});});return courses.map(cr=>({course:cr.course,vec:cols.map(c=>{const v=cr[c],mn=mins[c],mx=maxs[c];return(typeof v==="number"&&mx>mn)?(v-mn)/(mx-mn):0;}),weights,data:cr}));};
const findSimilarCourses=(name,vecs,n=10)=>{const target=vecs.find(v=>v.course?.toLowerCase()===name?.toLowerCase());if(!target)return[];return vecs.filter(v=>v.course!==target.course).map(v=>({...v,sim:cosineSim(target.vec,v.vec,target.weights)})).sort((a,b)=>b.sim-a.sim).slice(0,n);};
const fuzzyMatch=(name,courses)=>{if(!name||!courses.length)return null;const nl=name.toLowerCase().replace(/[^a-z0-9]/g,"");let best=null,bestS=0;courses.forEach(c=>{const cl=(c.course||"").toLowerCase().replace(/[^a-z0-9]/g,"");let s=0;if(cl===nl)s=1;else if(cl.includes(nl)||nl.includes(cl))s=0.9;else{let m=0;for(let i=0;i<Math.min(cl.length,nl.length);i++)if(cl[i]===nl[i])m++;s=m/Math.max(cl.length,nl.length);}if(s>bestS){bestS=s;best=c;}});return bestS>0.4?best:null;};

/* ── correlation ── */
const pearsonCorr=(x,y)=>{const n=x.length;if(n<3)return 0;const mx=x.reduce((a,b)=>a+b,0)/n,my=y.reduce((a,b)=>a+b,0)/n;let num=0,dx=0,dy=0;for(let i=0;i<n;i++){const a=x[i]-mx,b=y[i]-my;num+=a*b;dx+=a*a;dy+=b*b;}return(dx&&dy)?num/Math.sqrt(dx*dy):0;};
const rankArray=(arr)=>{const idx=arr.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);const ranks=new Array(arr.length);for(let i=0;i<idx.length;){let j=i;while(j<idx.length&&idx[j].v===idx[i].v)j++;const avg=(i+j+1)/2;for(let k=i;k<j;k++)ranks[idx[k].i]=avg;i=j;}return ranks;};
const spearmanCorr=(x,y)=>pearsonCorr(rankArray(x),rankArray(y));

/* ── compute optimal weights from SG correlation ── */
const computeOptimalWeights=(rounds)=>{
  const byP={};rounds.forEach(r=>{const pid=r.dg_id||r.player_name;if(!pid)return;const key=pid;if(!byP[key])byP[key]={pid,name:r.player_name||pid,rounds:0,finish:999,sg_ott:0,sg_app:0,sg_arg:0,sg_putt:0};const p=byP[key];p.rounds++;p.sg_ott+=(r.sg_ott||0);p.sg_app+=(r.sg_app||0);p.sg_arg+=(r.sg_arg||0);p.sg_putt+=(r.sg_putt||0);
    /* Parse finish: handle "T15", "1", "CUT", "MC", "WD", numeric, or nested */
    const ft=r.fin_text||r.finish_position||r.position||"";const digits=String(ft).match(/\d+/);const fn=digits?parseInt(digits[0]):999;p.finish=Math.min(p.finish,fn);});
  const entries=Object.values(byP).filter(p=>p.rounds>=2&&p.finish<900);
  if(entries.length<10)return null;
  const finishes=entries.map(e=>e.finish);
  const corrs=SG_CATS.map(c=>({...c,corr:spearmanCorr(entries.map(e=>e[c.k]),finishes)}));
  const abs=corrs.map(c=>Math.abs(c.corr));const tot=abs.reduce((a,b)=>a+b,0)||1;
  return{corrs:corrs.map((c,i)=>({...c,pct:Math.round(abs[i]/tot*100)})),n:entries.length};
};

/* ── Course SG Difficulty profile data ── */
const buildCourseSG=(course,allCourses)=>{
  if(!course||!allCourses?.length)return null;
  return COURSE_SG_DISPLAY.map(r=>{
    const vals=allCourses.map(c=>c[r.k]).filter(v=>typeof v==="number"&&!isNaN(v));
    const avg=vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
    const raw=typeof course[r.k]==="number"?course[r.k]:avg;
    const diff=raw-avg;
    const absDevs=vals.map(v=>Math.abs(v-avg));
    const maxDev=Math.max(...absDevs,0.0001);
    return{l:r.l,raw,avg,diff,relPct:Math.abs(diff)/maxDev};
  });
};

/* ── DataGolf fetch ── */
const dgFetch=async(path,params,pi)=>{const url=new URL(DG_BASE+path);Object.entries(params).forEach(([k,v])=>url.searchParams.set(k,v));url.searchParams.set("file_format","json");const raw=url.toString(),proxied=PROXIES[pi]?.fn(raw)||raw;const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),15000));const req=fetch(proxied,{headers:{Accept:"application/json"}}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}).then(d=>d?.contents?JSON.parse(d.contents):d);return Promise.race([req,timeout]);};
const findArr=d=>{if(Array.isArray(d))return d;if(typeof d!=="object"||!d)return null;const preferred=["match_list","matchups","matches","data","players","scores"];for(const k of preferred){if(Array.isArray(d[k])&&d[k].length>0&&typeof d[k][0]==="object")return d[k];}let best=null;for(const k of Object.keys(d)){if(Array.isArray(d[k])&&d[k].length>0&&typeof d[k][0]==="object"){if(!best||d[k].length>best.length)best=d[k];}}if(best)return best;const v=Object.values(d);if(v.length>5&&v.every(x=>typeof x==="object"&&x&&!Array.isArray(x)))return v;return null;};

/* ── simulation engine ── */
const runSim=(players,weights,n,sigma=DEFAULT_SIGMA)=>{if(!players.length)return{results:[],allScores:null};const st=weights.sg_dist+weights.sg_acc+weights.sg_app+weights.sg_arg+weights.sg_putt;const w=st>0?{dist:weights.sg_dist/st,acc:weights.sg_acc/st,app:weights.sg_app/st,arg:weights.sg_arg/st,putt:weights.sg_putt/st}:{dist:.2,acc:.2,app:.2,arg:.2,putt:.2};const skills=players.map(p=>{const userSG=p.sg_dist*w.dist+p.sg_acc*w.acc+p.sg_app*w.app+p.sg_arg*w.arg+p.sg_putt*w.putt;const eqSG=(p.sg_dist+p.sg_acc+p.sg_app+p.sg_arg+p.sg_putt)*0.2;const delta=(userSG-eqSG)*SENSITIVITY;const base=(p.baseline||0)+delta;return base+(p.course_history_adj||0)*weights.course_history+(p.course_fit_adj||0)*weights.course_fit+(p.recent_form_adj||0)*weights.recent_form+(p.similar_course_adj||0)*weights.similar_course;});const res=players.map(()=>({w:0,t5:0,t10:0,t20:0,mc:0,tp:0}));const store=n<=MAX_STORE;const allScores=store?[]:null;for(let s=0;s<n;s++){const sc=skills.map(sk=>{let t=0;for(let r=0;r<4;r++)t+=-(sk+normalRandom()*sigma);return t;});if(store)allScores.push(new Float32Array(sc));const ix=sc.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v);let pos=1;for(let j=0;j<ix.length;){let k=j;while(k<ix.length&&Math.abs(ix[k].v-ix[j].v)<.001)k++;const avg=(pos+pos+k-j-1)/2;for(let m=j;m<k;m++){const pi=ix[m].i;res[pi].tp+=avg;if(avg<=1)res[pi].w++;if(avg<=5)res[pi].t5++;if(avg<=10)res[pi].t10++;if(avg<=20)res[pi].t20++;if(avg<=65)res[pi].mc++;}pos+=k-j;j=k;}}return{results:players.map((p,i)=>({...p,sim_win:res[i].w/n,sim_top5:res[i].t5/n,sim_top10:res[i].t10/n,sim_top20:res[i].t20/n,sim_make_cut:res[i].mc/n,avg_finish:res[i].tp/n})),allScores};};
const computeH2H=(allScores,players,pairs)=>{const idxMap={};players.forEach((p,i)=>idxMap[p.id]=i);const n=allScores.length,h2h={};for(const pair of pairs){const i=idxMap[pair.id1],j=idxMap[pair.id2];if(i==null||j==null)continue;let iW=0;for(let s=0;s<n;s++){if(allScores[s][i]<allScores[s][j])iW++;}h2h[pair.id1+"_"+pair.id2]=iW/n;h2h[pair.id2+"_"+pair.id1]=1-iW/n;}return h2h;};

/* ══ Course SG Difficulty Profile ══ */
function CourseSGProfile({data,courseName}){
  if(!data||!data.length)return null;
  const maxAbsDiff=Math.max(...data.map(d=>Math.abs(d.diff)),0.001);
  return <div style={{padding:16,background:"#0f172a",borderRadius:6,border:"1px solid #1e293b"}}>
    <div style={{fontSize:13,fontWeight:700,color:"#e2e8f0",marginBottom:4}}>{courseName} — SG Difficulty vs Tour Average</div>
    <div style={{fontSize:9,color:"#64748b",marginBottom:14}}>Negative = harder than avg PGA Tour course. Larger deviations = more player differentiation in that category.</div>
    {data.map(d=>{const pct=d.diff/maxAbsDiff;const barW=Math.abs(pct)*42;const isHard=d.diff<0;
      return <div key={d.l} style={{display:"grid",gridTemplateColumns:"110px 75px 1fr 60px",alignItems:"center",padding:"9px 0",borderBottom:"1px solid #1e293b"}}>
        <div style={{fontSize:11,fontWeight:600,color:"#cbd5e1"}}>{d.l}</div>
        <div style={{fontSize:13,fontWeight:700,color:isHard?"#f59e0b":"#22d3ee",textAlign:"right",paddingRight:14}}>{d.raw>=0?"+":""}{d.raw.toFixed(3)}</div>
        <div style={{display:"flex",alignItems:"center",height:18}}>
          <div style={{flex:1,position:"relative",height:12,background:"#1e293b",borderRadius:6}}>
            <div style={{position:"absolute",left:"50%",top:0,bottom:0,width:1,background:"#475569"}}/>
            <div style={{position:"absolute",top:1,bottom:1,borderRadius:5,
              left:isHard?(50-barW)+"%":"50%",width:barW+"%",
              background:isHard?"#f59e0b":"#22d3ee",opacity:0.8}}/>
          </div>
        </div>
        <div style={{fontSize:8,color:"#475569",textAlign:"right"}}>avg {d.avg>=0?"+":""}{d.avg.toFixed(3)}</div>
      </div>;})}
    <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:12,fontSize:9,color:"#64748b"}}>
      <span>◀ Harder <span style={{color:"#f59e0b"}}>■</span></span>
      <span style={{color:"#334155"}}>|</span>
      <span><span style={{color:"#22d3ee"}}>■</span> Easier ▶</span>
    </div>
  </div>;
}

/* ══ PasteBox ══ */
function PasteBox({onImport}){const [t,setT]=useState("");const [st,setSt]=useState(null);const [log,setLog]=useState([]);const go=()=>{if(!t.trim())return;const r=onImport(t);setSt(r);if(r.ok){setLog(l=>[...l,r.msg]);setT("");}};
  return(<div><label style={{fontSize:11,fontWeight:600,color:"#94a3b8",textTransform:"uppercase",letterSpacing:"0.05em"}}>Paste JSON Data</label><div style={{fontSize:10,color:"#64748b",marginBottom:4}}>Auto-detects: decompositions, predictions, skills, odds, matchups, event list.</div>
    <div style={{position:"relative"}}><textarea value={t} onChange={e=>setT(e.target.value)} rows={4} placeholder="Paste DataGolf JSON..." style={{width:"100%",padding:"9px 11px",fontSize:11,fontFamily:"'JetBrains Mono',monospace",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:5,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>{t.trim()&&<button onClick={go} style={{position:"absolute",bottom:8,right:8,padding:"4px 10px",fontSize:10,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer"}}>Import</button>}</div>
    {st&&<div style={{fontSize:11,marginTop:3,padding:"4px 7px",borderRadius:3,background:st.ok?"#0a2e1a":"#1c1117",color:st.ok?"#4ade80":"#fca5a5",border:"1px solid "+(st.ok?"#166534":"#7f1d1d")}}>{st.msg}</div>}
    {log.length>0&&<div style={{marginTop:6,display:"flex",flexWrap:"wrap",gap:3}}>{log.map((l,i)=>(<span key={i} style={{fontSize:9,padding:"2px 5px",borderRadius:3,background:"#164e63",color:"#67e8f9"}}>{l}</span>))}</div>}</div>);
}

/* ══ PlayerCard ══ */
function PlayerCard({player:p,n,bankroll,kellyFrac}){
  const smk={win:"sim_win",top_5:"sim_top5",top_10:"sim_top10",top_20:"sim_top20",make_cut:"sim_make_cut"};
  const sgMax=Math.max(...[p.sg_dist,p.sg_acc,p.sg_app,p.sg_arg,p.sg_putt].map(v=>Math.abs(v||0)),0.05);
  const bar=(v)=><div style={{display:"flex",alignItems:"center",gap:6}}><div style={{width:55,textAlign:"right",fontSize:10,color:"#94a3b8"}}>{v>0?"+":""}{(v||0).toFixed(3)}</div><div style={{flex:1,height:7,background:"#1e293b",borderRadius:4,overflow:"hidden"}}><div style={{width:Math.abs((v||0)/sgMax*100)+"%",height:"100%",background:v>=0?"#22c55e":"#ef4444",borderRadius:4}}/></div></div>;
  return<div style={{padding:"14px 18px",background:"#090d14",display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
    <div><div style={{fontSize:12,fontWeight:700,color:"#22d3ee",marginBottom:8}}>{p.name} — SG Profile</div>
      {[["Drv Distance",p.sg_dist],["Drv Accuracy",p.sg_acc],["Approach",p.sg_app],["Around Green",p.sg_arg],["Putting",p.sg_putt]].map(([l,v])=>(<div key={l} style={{marginBottom:6}}><div style={{fontSize:9,color:"#64748b",marginBottom:2,textTransform:"uppercase"}}>{l}</div>{bar(v||0)}</div>))}
      <div style={{marginTop:10,fontSize:10,color:"#64748b"}}>Base: <b style={{color:"#e2e8f0"}}>{p.baseline?.toFixed(4)||"—"}</b> · CH: <b style={{color:"#e2e8f0"}}>{(p.course_history_adj||0).toFixed(4)}</b> · Fit: <b style={{color:"#e2e8f0"}}>{(p.course_fit_adj||0).toFixed(4)}</b> · Basket: <b style={{color:"#f59e0b"}}>{p.basket_rounds>=MIN_BASKET_ROUNDS?(p.similar_course_adj||0).toFixed(4):"—"}</b>{p.basket_rounds>0&&<span style={{color:"#475569"}}> ({p.basket_rounds}r)</span>}</div></div>
    <div><div style={{fontSize:12,fontWeight:700,color:"#22d3ee",marginBottom:8}}>Probabilities & DK Odds</div>

  /* ── Matchup parser: handles nested {odds: {book: {p1,p2,tie}}}, flat {p1_book}, and multi-book ── */
  const parseMatchupPairs=(ma)=>{const pairs=[];const arr=findArr(ma)||[];arr.forEach(m=>{
    const id1=m.p1_dg_id||m.player1_dg_id||m.p1_id||null,id2=m.p2_dg_id||m.player2_dg_id||m.p2_id||null;
    const n1=m.player1||m.p1_player_name||m.p1_name||"",n2=m.player2||m.p2_player_name||m.p2_name||"";
    /* Collect all book odds — try nested odds.{book} first, then flat {p1_book} keys */
    const books={};/* { book: {p1, p2, tie} } */
    /* 1. Nested: m.odds = {draftkings: {p1: 2.0, p2: 1.85, tie: 15}, ...} */
    if(m.odds&&typeof m.odds==="object"&&!Array.isArray(m.odds)){Object.entries(m.odds).forEach(([bk,v])=>{if(!v||typeof v!=="object")return;const bl=bk.toLowerCase().replace(/[\s_]/g,"");const matchedBook=KNOWN_BOOKS.find(b=>bl.includes(b));if(!matchedBook)return;books[matchedBook]={p1:+v.p1||+v.player1||0,p2:+v.p2||+v.player2||0,tie:+v.tie||0};});}
    /* 2. Flat: m.p1_draftkings = 2.0, m.p2_draftkings = 1.85, m.tie_draftkings = 15 */
    Object.entries(m).forEach(([k,v])=>{if(typeof v!=="number"||v<=0)return;const kl=k.toLowerCase().replace(/[\s_]/g,"");const matchedBook=KNOWN_BOOKS.find(b=>kl.includes(b));if(!matchedBook)return;if(!books[matchedBook])books[matchedBook]={p1:0,p2:0,tie:0};if(kl.includes("p1")||kl.includes("player1"))books[matchedBook].p1=Math.max(books[matchedBook].p1,v);else if(kl.includes("p2")||kl.includes("player2"))books[matchedBook].p2=Math.max(books[matchedBook].p2,v);else if(kl.includes("tie"))books[matchedBook].tie=Math.max(books[matchedBook].tie,v);});

    let best1=0,best1Book="",best2=0,best2Book="";Object.entries(books).forEach(([bk,o])=>{if(o.p1>best1){best1=o.p1;best1Book=bk;}if(o.p2>best2){best2=o.p2;best2Book=bk;}});
    /* Median (consensus) across books with odds > 1 */
    const sorted1=Object.values(books).map(o=>o.p1).filter(v=>v>1).sort((a,b)=>a-b);const sorted2=Object.values(books).map(o=>o.p2).filter(v=>v>1).sort((a,b)=>a-b);const med1=sorted1.length?sorted1[Math.floor(sorted1.length/2)]:0;const med2=sorted2.length?sorted2[Math.floor(sorted2.length/2)]:0;

      <div style={S.badges}>{players.length>0&&<span style={S.badge}>{players.length} players</span>}{simRes&&<span style={S.badge}>{simCount.toLocaleString()} sims</span>}{courseCSV&&<span style={{...S.badge,color:"#a78bfa",borderColor:"#7c3aed"}}>{courseCSV.length} courses</span>}</div></div>
    <div style={S.tabs}>{TABS.map(([id,lb,en])=>(<button key={id} disabled={!en} onClick={()=>{setTab(id);if(id==="results")setSubTab("sim_results");}} style={{...S.tab,...(tab===id?S.tabOn:{}),...(!en?S.tabOff:{})}}>{lb}</button>))}</div>
    {tab==="results"&&<div style={S.subTabs}>{RESULT_SUBS.map(([id,lb])=>(<button key={id} onClick={()=>setSubTab(id)} style={{...S.subTab,...(subTab===id?S.subTabOn:{})}}>{lb}</button>))}</div>}
    {error&&tab==="setup"&&<div style={S.err}>⚠ {error}</div>}

    {/* ═══ SETUP ═══ */}
    {tab==="setup"&&<div style={S.panel}>
      <h2 style={S.h2}>API Configuration</h2>
      <div style={S.row}><input type="password" value={apiKeyInp} onChange={e=>setApiKeyInp(e.target.value)} placeholder="DataGolf API key..." style={S.inp}/><button onClick={saveKey} style={S.btnP}>Save Key</button></div>
      {apiKey&&<div style={S.ok}>✓ DataGolf key saved</div>}
      <button onClick={()=>fetchAll(0)} disabled={!apiKey||loading} style={{...S.btnBig,marginTop:14,opacity:(!apiKey||loading)?0.5:1}}>{loading?"⏳ "+fetchSt:"🔄 Fetch Current Tournament Data"}</button>
      <div style={{...S.dv,margin:"22px 0 14px"}}/>
      <h2 style={S.h2}>Data Import Dashboard</h2>
      <div style={{display:"flex",flexDirection:"column",gap:5}}>
        {[{key:"decomp",label:"Player Decompositions",req:true,on:dSt.decomp,path:"/preds/player-decompositions?tour=pga"},{key:"preds",label:"Pre-Tournament Predictions",on:dSt.preds,path:"/preds/pre-tournament?tour=pga&odds_format=percent"},{key:"skills",label:"Skill Ratings",on:dSt.skills,path:"/preds/skill-ratings?display=value"},{key:"odds_win",label:"Odds — Win",on:dSt.odds.includes("win"),path:"/betting-tools/outrights?tour=pga&market=win&odds_format=decimal"},{key:"odds_t5",label:"Odds — Top 5",on:dSt.odds.includes("top_5"),path:"/betting-tools/outrights?tour=pga&market=top_5&odds_format=decimal"},{key:"odds_t10",label:"Odds — Top 10",on:dSt.odds.includes("top_10"),path:"/betting-tools/outrights?tour=pga&market=top_10&odds_format=decimal"},{key:"odds_t20",label:"Odds — Top 20",on:dSt.odds.includes("top_20"),path:"/betting-tools/outrights?tour=pga&market=top_20&odds_format=decimal"},{key:"matchups",label:"Matchups ("+dSt.matchups+")",on:dSt.matchups>0,path:"/betting-tools/matchups?tour=pga&market=tournament_matchups&odds_format=decimal"}].map(d=>(<div key={d.key} style={{...S.stRow,borderLeft:"3px solid "+(d.on?"#22c55e":d.req?"#f59e0b":"#334155")}}><div style={{flex:1}}><span style={{color:d.on?"#22c55e":"#64748b",fontWeight:600,fontSize:12}}>{d.on?"✓":"○"} {d.label}</span></div>{apiKey&&!d.on&&<button onClick={()=>window.open(DG_BASE+d.path+"&file_format=json&key="+apiKey,"_blank")} style={S.btnSm}>Open ↗</button>}</div>))}
      </div>
      <div style={{marginTop:8,...S.stRow,borderLeft:"3px solid "+(eventList?"#22c55e":"#334155")}}><div style={{flex:1}}><span style={{color:eventList?"#22c55e":"#64748b",fontWeight:600,fontSize:12}}>{eventList?"✓":"○"} Historical Event List{eventList?" ("+eventList.length+")":""}</span><div style={{fontSize:10,color:"#475569",marginTop:1}}>For Course & Grading — load once</div></div><div style={{display:"flex",gap:4}}><button onClick={()=>{if(eventList){setEventList(null);sSet("eventList",null);setTimeout(fetchEventList,50);}else{fetchEventList();}}} disabled={eventListLoading} style={S.btnSm}>{eventListLoading?"⏳":eventList?"↻ Refresh":"Load"}</button>{!eventList&&<button onClick={()=>window.open(eventListUrl,"_blank")} style={S.btnSm}>Open ↗</button>}</div></div>
      {eventListError&&<div style={{fontSize:10,color:"#fca5a5",marginTop:4}}>{eventListError}</div>}
      <div style={{marginTop:8,...S.stRow,borderLeft:"3px solid "+(courseCSV?"#22c55e":"#334155")}}><div style={{flex:1}}><span style={{color:courseCSV?"#22c55e":"#64748b",fontWeight:600,fontSize:12}}>{courseCSV?"✓":"○"} Course Characteristics CSV{courseCSV?" ("+courseCSV.length+" courses)":""}</span></div><input type="file" accept=".csv" onChange={handleCSVUpload} style={{fontSize:10,color:"#94a3b8",maxWidth:200}}/></div>
      <div style={{marginTop:14}}><PasteBox onImport={handleImport}/></div>
      {players.length>0&&<div style={S.loadBar}><span>✓ {players.length} players loaded</span><button onClick={()=>setTab("course")} style={S.btnP}>Course →</button></div>}
    </div>}

    {/* ═══ COURSE ═══ */}
    {tab==="course"&&<div style={S.panel}>
      <h2 style={S.h2}>Course Intelligence</h2>
      {courseCSV&&<div style={S.section}><h3 style={S.h3}>🎯 Course Match</h3>
        <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8}}><select value={courseMatchManual} onChange={e=>setCourseMatchManual(e.target.value)} style={{...S.inp,maxWidth:400}}><option value="">Select course...</option>{courseCSV.map(c=><option key={c.course} value={c.course}>{c.course}</option>)}</select><button onClick={manualCourseSelect} style={S.btnSm}>Match</button></div>
        {courseMatch&&<div style={{padding:12,background:"#0f172a",borderRadius:6,border:"1px solid #1e293b"}}><div style={{fontSize:14,fontWeight:700,color:"#22d3ee",marginBottom:8}}>{courseMatch.course}</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(110px,1fr))",gap:8}}>{[["Par",courseMatch.par],["Yards",courseMatch.yardage],["Adj Score",courseMatch.adj_score_to_par?.toFixed(2)],["FW Width",courseMatch.fw_width?.toFixed(1)],["SG Putt",courseMatch.putt_sg?.toFixed(3)],["SG App",courseMatch.app_sg?.toFixed(3)],["SG OTT",courseMatch.ott_sg?.toFixed(3)],["SG ARG",courseMatch.arg_sg?.toFixed(3)]].map(([l,v])=>(<div key={l}><div style={{fontSize:8,color:"#64748b",textTransform:"uppercase"}}>{l}</div><div style={{fontSize:13,fontWeight:700,color:"#e2e8f0"}}>{v??"-"}</div></div>))}</div></div>}
      </div>}
      {/* Course Characteristic Radar from CSV */}
      {courseSGData&&<div style={S.section}><h3 style={S.h3}>📈 Course SG Difficulty Profile</h3>
        <CourseSGProfile data={courseSGData} courseName={courseMatch?.course||"Course"}/>
      </div>}
      {similarCourses.length>0&&<div style={S.section}><h3 style={S.h3}>🔗 Top 10 Similar Courses</h3>
        <div style={S.tW}><table style={S.table}><thead><tr><th style={S.th}>#</th><th style={{...S.th,textAlign:"left"}}>Course</th><th style={S.th}>Sim%</th><th style={S.th}>Par</th><th style={S.th}>Yards</th><th style={S.th}>SG Putt</th><th style={S.th}>SG App</th><th style={S.th}>SG OTT</th></tr></thead><tbody>
          {similarCourses.map((c,i)=>(<tr key={c.course} style={i%2?S.trO:S.trE}><td style={S.tdR}>{i+1}</td><td style={S.tdN}>{c.course}</td><td style={{...S.td,fontWeight:700,color:c.sim>0.95?"#22c55e":"#22d3ee"}}>{(c.sim*100).toFixed(1)}%</td><td style={S.td}>{c.data.par}</td><td style={S.td}>{c.data.yardage}</td><td style={S.td}>{c.data.putt_sg?.toFixed(3)}</td><td style={S.td}>{c.data.app_sg?.toFixed(3)}</td><td style={S.td}>{c.data.ott_sg?.toFixed(3)}</td></tr>))}
        </tbody></table></div></div>}
      {/* Historical Weights Fetch */}
      {/* Historical Rounds Paste Workflow */}
      <div style={S.section}><h3 style={S.h3}>📊 Historical Rounds Data</h3>
        <div style={{fontSize:10,color:"#64748b",marginBottom:8}}>Paste historical rounds JSON from DataGolf. Each paste accumulates — paste one year at a time. Used for Historical Optimal Weights and AV Basket Fit.</div>
        {eventList&&<div style={{marginBottom:8}}>
          <select value={histEventId} onChange={e=>setHistEventId(e.target.value)} style={{...S.inp,maxWidth:400,marginBottom:6}}><option value="">Select event for URL helper...</option>{eventList.map((ev,i)=><option key={i} value={ev.event_id||""}>{fmtEventLabel(ev)}</option>)}</select>
          {histEventId&&apiKey&&<div style={{display:"flex",gap:4,flexWrap:"wrap"}}>{[2026,2025,2024,2023,2022,2021].map(yr=><button key={yr} onClick={()=>window.open(DG_BASE+"/historical-raw-data/rounds?tour=pga&event_id="+histEventId+"&year="+yr+"&file_format=json&key="+apiKey,"_blank")} style={{...S.btnSm,fontSize:9,background:"#1e293b",color:"#94a3b8"}}>{yr} ↗</button>)}</div>}
          {histEventId&&!apiKey&&<div style={{fontSize:10,color:"#f59e0b"}}>Save DG API key on Setup tab for URL buttons.</div>}
        </div>}
        {!eventList&&<div style={{fontSize:10,color:"#f59e0b",marginBottom:6}}>Load Event List on Setup tab for URL helper buttons.</div>}
        <div style={{position:"relative"}}><textarea value={histPasteText} onChange={e=>setHistPasteText(e.target.value)} rows={3} placeholder="Paste DataGolf historical-raw-data/rounds JSON here..." style={{width:"100%",padding:"9px 11px",fontSize:11,fontFamily:"'JetBrains Mono',monospace",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:5,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
          {histPasteText.trim()&&<button onClick={processHistPaste} style={{position:"absolute",bottom:8,right:8,padding:"4px 10px",fontSize:10,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer"}}>Process</button>}</div>
        <div style={{display:"flex",gap:6,marginTop:6,alignItems:"center"}}>{histPasteLog.length>0&&<button onClick={clearHistPaste} style={{...S.btnSm,fontSize:9,background:"#7f1d1d",color:"#fca5a5"}}>Clear All Pasted Data</button>}
          {(sGet("histRounds")||[]).length>0&&<span style={{fontSize:10,color:"#22c55e"}}>{(sGet("histRounds")||[]).length} total rounds loaded</span>}</div>
        {histPasteLog.length>0&&<div style={{marginTop:6,display:"flex",flexDirection:"column",gap:3}}>{histPasteLog.map((l,i)=>(<div key={i} style={{fontSize:10,color:l.ok?"#4ade80":"#fca5a5"}}>{l.msg}</div>))}</div>}
      </div>
      {/* Course Fit — DG + AV Basket */}
      {players.length>0&&<div style={S.section}><h3 style={S.h3}>🎯 Course Fit — Top 15</h3>
        <div style={S.tW}><table style={S.table}><thead><tr><th style={S.th}>#</th><th style={{...S.th,textAlign:"left"}}>Player</th><th style={S.th}>DG Fit</th><th style={S.th}>DG Hx</th><th style={{...S.th,color:"#f59e0b"}}>AV Basket</th><th style={{...S.th,color:"#f59e0b",fontSize:7}}>Rnds</th><th style={S.th}>Combined</th></tr></thead><tbody>
          {[...players].sort((a,b)=>((b.course_fit_adj||0)+(b.course_history_adj||0)+(b.similar_course_adj||0))-((a.course_fit_adj||0)+(a.course_history_adj||0)+(a.similar_course_adj||0))).slice(0,15).map((p,i)=>{const bk=p.similar_course_adj||0;const br=p.basket_rounds||0;const hasBk=br>=MIN_BASKET_ROUNDS;const combined=(p.course_fit_adj||0)+(p.course_history_adj||0)+bk;return<tr key={p.id} style={i%2?S.trO:S.trE}><td style={S.tdR}>{i+1}</td><td style={S.tdN}>{topFit.has(p.id)?"🎯 ":""}{topBasket.has(p.id)?"🔶 ":""}{p.name}</td><td style={{...S.td,color:(p.course_fit_adj||0)>0?"#22c55e":"#ef4444"}}>{(p.course_fit_adj||0)>0?"+":""}{(p.course_fit_adj||0).toFixed(3)}</td><td style={{...S.td,color:(p.course_history_adj||0)>0?"#22c55e":"#ef4444"}}>{(p.course_history_adj||0)>0?"+":""}{(p.course_history_adj||0).toFixed(3)}</td><td style={{...S.td,color:hasBk?(bk>0?"#f59e0b":"#ef4444"):"#334155"}}>{hasBk?(bk>0?"+":"")+bk.toFixed(3):"—"}</td><td style={{...S.td,color:"#475569",fontSize:9}}>{br>0?br+"r":""}</td><td style={{...S.td,fontWeight:700}}>{combined>0?"+":""}{combined.toFixed(3)}</td></tr>;})}
        </tbody></table></div></div>}
      {/* Weather */}
      <div style={S.section}><h3 style={S.h3}>🌤 Weather</h3><div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}><input value={weatherCity} onChange={e=>setWeatherCity(e.target.value)} placeholder={tourney?.city||"Enter city..."} style={{...S.inp,maxWidth:250}}/><button onClick={fetchWeather} disabled={weatherLoading} style={S.btnSm}>{weatherLoading?"...":"Fetch"}</button></div>
        {weatherData?.error&&<div style={{fontSize:11,color:"#fca5a5"}}>{weatherData.error}</div>}
        {weatherData?.forecast&&<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))",gap:8}}>{weatherData.forecast.forecastday.map(d=>{const windy=d.day.maxwind_mph>=15,rainy=d.day.daily_chance_of_rain>=40;return<div key={d.date} style={{padding:10,background:"#0f172a",borderRadius:6,border:"1px solid "+(windy||rainy?"#f59e0b":"#1e293b")}}><div style={{fontSize:10,fontWeight:700,color:"#cbd5e1"}}>{new Date(d.date+"T12:00").toLocaleDateString("en",{weekday:"short",month:"short",day:"numeric"})}</div><div style={{fontSize:18,fontWeight:700,color:"#e2e8f0"}}>{d.day.maxtemp_f?.toFixed(0)}°F</div><div style={{fontSize:9,color:"#64748b"}}>{d.day.condition?.text}</div><div style={{fontSize:9,color:windy?"#f59e0b":"#64748b"}}>💨 {d.day.maxwind_mph}mph</div><div style={{fontSize:9,color:rainy?"#f59e0b":"#64748b"}}>🌧 {d.day.daily_chance_of_rain}%</div></div>;})}</div>}
        {weatherInsights&&<div style={{marginTop:12}}>{weatherInsights.tips.map((t,i)=>(<div key={i} style={{padding:"8px 12px",marginBottom:6,background:"#0f172a",borderRadius:5,borderLeft:"3px solid #f59e0b",fontSize:11,color:"#e2e8f0"}}><span style={{marginRight:6}}>{t.icon}</span>{t.text}</div>))}</div>}
      </div>
    </div>}

    {/* ═══ FIELD ═══ */}
    {tab==="field"&&<div style={S.panel}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
        <div><h2 style={S.h2}>Field Analysis</h2><p style={{fontSize:10,color:"#64748b"}}>Rankings within this field.{topFit.size>0?" 🎯 = DG Top 10 Fit.":""}{topBasket.size>0?" 🔶 = AV Basket Top 10.":""}</p></div>
        <div style={{display:"flex",gap:4}}>{["value","rank"].map(m=>(<button key={m} onClick={()=>setFieldMode(m)} style={{...S.simBtn,...(fieldMode===m?S.simBtnOn:{})}}>{m==="value"?"Values":"Ranks"}</button>))}</div>
      </div>
      <div style={S.tW}><table style={S.table}><thead><tr>
        <th style={S.th}>#</th><th style={{...S.th,textAlign:"left",cursor:"pointer"}} onClick={()=>setFieldSort(s=>({col:"name",dir:s.dir==="asc"?"desc":"asc"}))}>Player</th>
        {[["sg_dist","Drv Dist"],["sg_acc","Drv Acc"],["sg_app","Approach"],["sg_arg","ARG"],["sg_putt","Putting"],["sg_total","Total SG"],["baseline","Baseline"],["course_fit_adj","DG Fit"],["course_history_adj","Hx"],["similar_course_adj","Basket"],["recent_form_adj","Form"]].map(([c,l])=>(
          <th key={c} style={{...S.th,cursor:"pointer",color:c==="similar_course_adj"?"#f59e0b":undefined}} onClick={()=>setFieldSort(s=>s.col===c?{...s,dir:s.dir==="desc"?"asc":"desc"}:{col:c,dir:"desc"})}>{l}{fieldSort.col===c?" "+(fieldSort.dir==="asc"?"↑":"↓"):""}</th>
        ))}
      </tr></thead><tbody>
        {fieldData.slice(0,showAll?999:100).map((p,i)=>{const isDgFit=topFit.has(p.id);const isBk=topBasket.has(p.id);const hasBk=(p.basket_rounds||0)>=MIN_BASKET_ROUNDS;return<tr key={p.id} style={{...(i%2?S.trO:S.trE),...(isDgFit?{borderLeft:"3px solid #22c55e"}:isBk?{borderLeft:"3px solid #f59e0b"}:{})}}>
          <td style={S.tdR}>{i+1}</td><td style={{...S.tdN,...(isDgFit?{color:"#22c55e"}:isBk?{color:"#f59e0b"}:{})}}>{isDgFit?"🎯 ":""}{isBk?"🔶 ":""}{p.name}</td>
          {["sg_dist","sg_acc","sg_app","sg_arg","sg_putt","sg_total","baseline","course_fit_adj","course_history_adj","similar_course_adj","recent_form_adj"].map(c=>{
            const v=p[c]||0;const rank=p.ranks?.[c]?.[p.id];const isBkCol=c==="similar_course_adj";
            if(isBkCol&&!hasBk)return<td key={c} style={{...S.td,color:"#334155"}}>—</td>;
            return<td key={c} style={{...S.td,color:isBkCol?(v>0.01?"#f59e0b":v<-0.01?"#ef4444":"#475569"):(v>0.05?"#22c55e":v<-0.05?"#ef4444":"#94a3b8")}}>{fieldMode==="value"?(v>0?"+":"")+v.toFixed(3):rank?("#"+rank):"-"}</td>;
          })}
        </tr>;})}
      </tbody></table></div>
      {!showAll&&players.length>100&&<button onClick={()=>setShowAll(true)} style={{...S.btnSm,marginTop:8}}>Show All {players.length}</button>}
    </div>}

    {/* ═══ SIMULATION ═══ */}
    {tab==="simulation"&&<div style={S.panel}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 280px",gap:18}}>
        <div>
          {histWeights&&<div style={{marginBottom:20,padding:14,background:"#0f172a",borderRadius:6,border:"1px solid #1e293b"}}>
            <h3 style={S.h3}>📊 Historical Optimal Weights (5yr)</h3>
            <div style={S.tW}><table style={S.table}><thead><tr><th style={S.th}>Year</th><th style={S.th}>Dist</th><th style={S.th}>Acc</th><th style={{...S.th,color:"#475569",fontStyle:"italic"}}>OTT</th><th style={S.th}>App</th><th style={S.th}>ARG</th><th style={S.th}>Putt</th><th style={S.th}>n</th></tr></thead><tbody>
              {histWeights.map((y,i)=>{const ott=y.opt.corrs.find(c=>c.k==="sg_ott")?.pct||0;return(<tr key={y.year} style={i%2?S.trO:S.trE}><td style={{...S.td,fontWeight:700}}>{y.year}</td><td style={{...S.td,color:"#22d3ee"}}>{Math.round(ott*OTT_DIST_RATIO)}%</td><td style={{...S.td,color:"#22d3ee"}}>{Math.round(ott*OTT_ACC_RATIO)}%</td><td style={{...S.td,color:"#475569",fontStyle:"italic"}}>{ott}%</td>{y.opt.corrs.filter(c=>c.k!=="sg_ott").map(c=><td key={c.k} style={{...S.td,color:"#22d3ee"}}>{c.pct}%</td>)}<td style={S.tdD}>{y.opt.n}</td></tr>);})}
              {hwAggregate&&(()=>{const ott=hwAggregate.sg_ott||0;return<tr style={{background:"#0a2e1a"}}><td style={{...S.td,fontWeight:700,color:"#22c55e"}}>AVG</td><td style={{...S.td,fontWeight:700,color:"#22c55e"}}>{Math.round(ott*OTT_DIST_RATIO)}%</td><td style={{...S.td,fontWeight:700,color:"#22c55e"}}>{Math.round(ott*OTT_ACC_RATIO)}%</td><td style={{...S.td,color:"#475569",fontStyle:"italic"}}>{ott}%</td>{SG_CATS.filter(c=>c.k!=="sg_ott").map(c=><td key={c.k} style={{...S.td,fontWeight:700,color:"#22c55e"}}>{hwAggregate[c.k]}%</td>)}<td style={S.td}></td></tr>;})()}
            </tbody></table></div>
            {hwAggregate&&<button onClick={applyOptimal} style={{...S.btnSm,marginTop:8,background:"#22c55e"}}>Apply Optimal Weights →</button>}
          </div>}
          {!histWeights&&<div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>Paste historical rounds on Course tab to generate optimal weights.</div>}

          <h2 style={S.h2}>SG Weights <span style={{fontSize:10,color:"#64748b",fontWeight:400}}>(sum to 100%)</span></h2>
          <div style={{fontSize:10,color:"#94a3b8",marginBottom:12,padding:"7px 11px",background:"#0f172a",borderRadius:4,borderLeft:"3px solid #22d3ee"}}>SENSITIVITY ×{SENSITIVITY}</div>
          {[{k:"dist",l:"Driving Distance"},{k:"acc",l:"Driving Accuracy"},{k:"app",l:"Approach"},{k:"arg",l:"Around Green"},{k:"putt",l:"Putting"}].map(s=>(<div key={s.k} style={S.slG}><div style={S.slH}><span style={S.slL}>{s.l}</span><span style={S.slV}>{sgW[s.k]}%</span></div><input type="range" min={0} max={100} value={sgW[s.k]} onChange={e=>adjSG(s.k,+e.target.value)} style={S.slider}/></div>))}
          <div style={{padding:"6px 12px",background:"#0f172a",borderRadius:5,fontSize:11,color:"#94a3b8",marginBottom:16}}>Total: <b style={{color:Object.values(sgW).reduce((a,b)=>a+b,0)===100?"#22c55e":"#ef4444"}}>{Object.values(sgW).reduce((a,b)=>a+b,0)}%</b></div>
          <h2 style={S.h2}>Context Multipliers <span style={{fontSize:10,color:"#64748b",fontWeight:400}}>(0–200%)</span></h2>

          <button onClick={doSim} disabled={simRunning||!players.length} style={{...S.btnRun,opacity:(simRunning||!players.length)?0.6:1}}>{simRunning?"⏳ Running...":"▶ Run "+simCount.toLocaleString()+" Simulations"}</button>
        </div>
        <div style={S.side}>
          <h3 style={S.h3}>Presets</h3><div style={{display:"flex",gap:4,marginBottom:8}}><input value={pName} onChange={e=>setPName(e.target.value)} placeholder="Name..." style={{...S.inp,fontSize:11,padding:"5px 8px"}}/><button onClick={savePre} disabled={!pName.trim()} style={{...S.btnSm,opacity:pName.trim()?1:0.4}}>Save</button></div>
          {presets.map(p=>(<div key={p.name} style={{display:"flex",gap:3,marginBottom:3}}><button onClick={()=>{setSgW(p.sg);setCtxW(prev=>({...prev,...p.cx}));}} style={S.preBtn}>{p.name}</button><button onClick={()=>{const u=presets.filter(x=>x.name!==p.name);setPresets(u);sSet("presets",u);}} style={S.preDel}>✕</button></div>))}
          <div style={{...S.dv,margin:"12px 0"}}/><h3 style={S.h3}>Quick Profiles</h3>
          {[{n:"Balanced",sg:{dist:20,acc:10,app:30,arg:20,putt:20},cx:{ch:100,cf:100,rf:100,sc:100}},{n:"Ball Striker",sg:{dist:20,acc:10,app:40,arg:15,putt:15},cx:{ch:100,cf:120,rf:100,sc:100}},{n:"Scrambler",sg:{dist:5,acc:10,app:20,arg:35,putt:30},cx:{ch:100,cf:100,rf:100,sc:100}},{n:"Course Horse",sg:{dist:20,acc:10,app:30,arg:20,putt:20},cx:{ch:180,cf:150,rf:80,sc:150}}].map(q=>(<button key={q.n} onClick={()=>{setSgW(q.sg);setCtxW(q.cx);}} style={S.qpBtn}>{q.n}</button>))}
        </div>
      </div>
    </div>}

          {sorted.slice(0,showAll?999:100).map((p,i)=>{const isExp=expanded===p.id;return(<React.Fragment key={p.id}><tr style={{...(i%2?S.trO:S.trE),cursor:"pointer"}} onClick={()=>setExpanded(isExp?null:p.id)}><td style={S.tdR}>{i+1}</td><td style={S.tdN}>{p.name} <span style={{color:isExp?"#22d3ee":"#334155",fontSize:9}}>{isExp?"▼":"▶"}</span></td><td style={S.tdH}>{pFmt(p.sim_win)}<br/><span style={{fontSize:8,color:"#64748b"}}>±{(ci95(p.sim_win,simCount)*100).toFixed(2)}%</span></td><td style={S.td}>{pFmt(p.sim_top5)}</td><td style={S.td}>{pFmt(p.sim_top10)}</td><td style={S.td}>{pFmt(p.sim_top20)}</td><td style={S.td}>{pFmt(p.sim_make_cut)}</td><td style={S.td}>{p.avg_finish?.toFixed(1)}</td><td style={S.tdD}>{p.dg_win>0?pFmt(p.dg_win):"-"}</td></tr>
            {isExp&&<tr><td colSpan={9} style={{padding:0,borderBottom:"2px solid #22d3ee33"}}><PlayerCard player={p} n={simCount} bankroll={bankroll} kellyFrac={kellyFrac}/></td></tr>}</React.Fragment>);})}
        </tbody></table></div>
        {!showAll&&sorted.length>100&&<button onClick={()=>setShowAll(true)} style={{...S.btnSm,marginTop:8}}>Show All {sorted.length}</button>}
      </div>}
      {subTab==="ev"&&simRes&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8,marginBottom:6}}><h2 style={S.h2}>EV Analysis</h2>
          <div style={{display:"flex",gap:3,flexWrap:"wrap"}}>{MARKETS.map(m=>(<button key={m} onClick={()=>setEvMktTab(m)} style={{...S.simBtn,padding:"4px 9px",fontSize:10,...(evMktTab===m?S.simBtnOn:{})}}>{MARKET_LABELS[m]}</button>))}</div>
        </div>
        <BetControlsBar bankroll={bankroll} setBankroll={setBankroll} kellyFrac={kellyFrac} setKellyFrac={setKellyFrac} oddsMode={oddsMode} setOddsMode={setOddsMode} devigOn={devigOn} setDevigOn={setDevigOn} useCIFilter={useCIFilter} setUseCIFilter={setUseCIFilter} showOnlyQualified={showOnlyQualified} setShowOnlyQualified={setShowOnlyQualified} minEV={minEV} setMinEV={setMinEV} mkt={evMktTab} onExport={csvEV}/>
        {!hasOdds&&<div style={S.warn}>No odds loaded. Fetch current tournament data or paste odds JSON on Setup tab.</div>}
        {hasOdds&&(()=>{const m=evMktTab;const rows=evData.filter(p=>p["ev_"+m]!=null).filter(p=>!showOnlyQualified||p["qualified_"+m]).sort((a,b)=>(b["ev_"+m]||-99)-(a["ev_"+m]||-99));const qCount=evData.filter(p=>p["qualified_"+m]).length;
          return<>
            <div style={{fontSize:10,color:"#94a3b8",marginBottom:6,padding:"4px 10px",background:"#0a0e17",borderRadius:4,display:"flex",gap:12,flexWrap:"wrap"}}>
              <span><b style={{color:"#22c55e"}}>{qCount}</b> qualified bets</span>
              <span style={{color:"#64748b"}}>|</span>
              <span>Min EV: <b style={{color:"#22d3ee"}}>{((minEV[m]||0)*100).toFixed(1)}%</b></span>
              <span style={{color:"#64748b"}}>|</span>
              <span>σ = {sigma.toFixed(2)}</span>
              <span style={{color:"#64748b"}}>|</span>
              <span>{devigOn?"De-vigged":"Raw"} implied · {useCIFilter?"CI-95 lower bound":"Point estimate"}</span>
            </div>
            <div style={S.tW}><table style={S.table}><thead><tr>
              <th style={S.th}>#</th>
              <th style={{...S.th,textAlign:"left"}}>Player</th>

              <th style={S.th}>{devigOn?"Dev Imp":"Imp"}</th>
              <th style={S.th}>Odds</th>
              <th style={S.th}>Book</th>
              <th style={{...S.th,color:"#22d3ee"}}>Edge</th>
              <th style={S.th}>True EV</th>
              <th style={S.th}>Qual</th>
              <th style={{...S.th,color:"#22d3ee"}}>Kelly $</th>
            </tr></thead><tbody>
              {rows.slice(0,100).map((p,i)=>{const ev=p["ev_"+m],sp=p["sim_"+m],low=p["ciLow_"+m],imp=p["impDevig_"+m],odd=p["odds_"+m],bk=p["oddsBook_"+m],trueEv=p["evTrue_"+m],k=p["kelly_"+m],q=p["qualified_"+m];
                return<tr key={p.id} style={{...(i%2?S.trO:S.trE),...(q?{borderLeft:"3px solid #22c55e"}:{})}}>
                  <td style={S.tdR}>{i+1}</td>
                  <td style={S.tdN}>{p.name}</td>
                  <td style={S.tdH}>{pFmtS(sp)}</td>
                  <td style={{...S.td,color:"#64748b",fontSize:9}}>{pFmtS(low)}</td>
                  <td style={{...S.td,color:"#94a3b8"}}>{pFmtS(imp)}</td>
                  <td style={S.td}>{odd?.toFixed(2)}</td>
                  <td style={{...S.tdD,fontSize:9}}>{(bk||"").slice(0,3).toUpperCase()}</td>

            {rows.length===0&&<div style={{padding:14,fontSize:11,color:"#94a3b8",textAlign:"center"}}>No rows match the current filters. Try disabling "Qualified only" or lowering Min EV.</div>}

      </div>}
      {subTab==="matchups"&&simRes&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8,marginBottom:6}}><h2 style={S.h2}>Matchup EV</h2>

            <div style={S.tW}><table style={S.table}><thead><tr>

              <th style={{...S.th,textAlign:"left"}}>P1</th>
              <th style={S.th}>Sim%</th>
              <th style={S.th}>Odds</th>
              <th style={S.th}>Bk</th>
              <th style={{...S.th,color:"#22d3ee"}}>EV</th>
              <th style={S.th}>Q</th>
              <th style={{...S.th,color:"#22d3ee"}}>Kelly</th>
              <th style={{...S.th,textAlign:"left"}}>P2</th>
              <th style={S.th}>Sim%</th>
              <th style={S.th}>Odds</th>
              <th style={S.th}>Bk</th>

              <th style={S.th}>Q</th>
              <th style={{...S.th,color:"#22d3ee"}}>Kelly</th>
            </tr></thead><tbody>
              {rows.slice(0,150).map((m,i)=>{const q=m.q1||m.q2;
                return<tr key={i} style={{...(i%2?S.trO:S.trE),...(q?{borderLeft:"3px solid #22c55e"}:{})}}>

                  <td style={S.td}>{m.q1?<span style={{color:"#22c55e",fontWeight:700}}>✓</span>:<span style={{color:"#475569"}}>—</span>}</td>
                  <td style={{...S.td,color:m.k1>0?"#22d3ee":"#334155",fontWeight:m.k1>0?700:400}}>{m.k1>0?"$"+m.k1.toFixed(2):"-"}</td>
                  <td style={{...S.tdN,color:m.q2?"#22c55e":"#f1f5f9"}}>{m.name2}</td>
                  <td style={S.tdH}>{m.s2!=null?pFmtS(m.s2):"-"}</td>
                  <td style={S.td}>{m.dec2>1?m.dec2.toFixed(2):"-"}</td>
                  <td style={{...S.tdD,fontSize:9}}>{(m.book2||"").slice(0,3).toUpperCase()}</td>
                  <td style={{...S.td,fontWeight:700,color:(m.ev2||0)>0.03?"#22c55e":(m.ev2||0)>0?"#4ade80":"#94a3b8"}}>{m.ev2!=null?((m.ev2>0?"+":"")+(m.ev2*100).toFixed(1)+"%"):"-"}</td>
                  <td style={S.td}>{m.q2?<span style={{color:"#22c55e",fontWeight:700}}>✓</span>:<span style={{color:"#475569"}}>—</span>}</td>
                  <td style={{...S.td,color:m.k2>0?"#22d3ee":"#334155",fontWeight:m.k2>0?700:400}}>{m.k2>0?"$"+m.k2.toFixed(2):"-"}</td>
                </tr>;})}
            </tbody></table></div>
            {rows.length===0&&<div style={{padding:14,fontSize:11,color:"#94a3b8",textAlign:"center"}}>No matchups match the filters. Disable "Qualified only" or lower Min EV.</div>}

      </div>}
      {subTab==="history"&&<div>

          {compareData.rows.map((r,i)=>(<tr key={r.name} style={i%2?S.trO:S.trE}><td style={S.tdR}>{i+1}</td><td style={S.tdN}>{r.name}</td><td style={{...S.td,color:"#22d3ee"}}>{pFmt(r.aW)}</td><td style={{...S.td,color:"#f59e0b"}}>{pFmt(r.bW)}</td><td style={{...S.td,fontWeight:700,color:r.dW>0.002?"#22c55e":r.dW<-0.002?"#ef4444":"#94a3b8"}}>{r.dW>0?"+":""}{(r.dW*100).toFixed(2)}%</td></tr>))}

          <div style={{fontSize:10,color:"#64748b"}}>{new Date(h.date).toLocaleString()} · {h.n?.toLocaleString()} sims</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:4,marginTop:4}}>{h.top30?.slice(0,5).map((t,j)=>(<span key={j} style={S.hP}>{j+1}. {t.n} ({(t.w*100).toFixed(1)}%)</span>))}</div></div>);})}

    {/* ═══ GRADING ═══ */}

      <h2 style={S.h2}>Post-Tournament Grading</h2>
      <div style={S.section}><h3 style={S.h3}>Select Simulation</h3><select value={gradingSim?.id||""} onChange={e=>{const h=hist.find(x=>x.id===+e.target.value);setGradingSim(h||null);}} style={{...S.inp,maxWidth:500,marginBottom:10}}><option value="">Choose...</option>{hist.map(h=><option key={h.id} value={h.id}>{h.t} — {new Date(h.date).toLocaleDateString()} — {h.n?.toLocaleString()} sims{h.allPlayers?" (full field)":" (top 30 only)"}</option>)}</select>
        {gradingSim&&!gradingSim.allPlayers&&<div style={{fontSize:10,color:"#f59e0b",marginTop:3}}>⚠ Legacy sim — only top 30 players saved. Future sims will store top 150.</div>}
      </div>

      <div style={S.section}><h3 style={S.h3}>Fetch Results</h3><div style={{display:"flex",gap:6,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
        {!eventList&&<span style={{fontSize:11,color:"#f59e0b"}}>⚠ Load Event List on Setup tab</span>}
        {eventList&&<select value={gradeEventId||""} onChange={e=>{const eid=e.target.value;setGradeEventId(eid);if(!gradeYear)setGradeYear(String(new Date().getFullYear()));}} style={{...S.inp,maxWidth:400}}><option value="">Select tournament...</option>{eventList.map((ev,i)=><option key={i} value={ev.event_id||""}>{fmtEventLabel(ev)}</option>)}</select>}

        {gradeEventId&&apiKey&&<button onClick={()=>window.open(DG_BASE+"/historical-raw-data/rounds?tour=pga&event_id="+gradeEventId+"&year="+gradeYear+"&file_format=json&key="+apiKey,"_blank")} style={S.btnSm}>Open ↗</button>}

        <div style={{marginTop:10,padding:"8px 10px",background:"#0a0e17",border:"1px solid #1e293b",borderRadius:5}}>
          <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>If fetch fails, click <b style={{color:"#22d3ee"}}>Open ↗</b> above, copy the JSON from that tab, and paste it here:</div>
          <div style={{position:"relative"}}><textarea value={gradePasteText} onChange={e=>setGradePasteText(e.target.value)} rows={3} placeholder="Paste DataGolf historical-raw-data/rounds JSON here..." style={{width:"100%",padding:"8px 10px",fontSize:10,fontFamily:"'JetBrains Mono',monospace",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:4,outline:"none",resize:"vertical",boxSizing:"border-box"}}/>
            {gradePasteText.trim()&&<button onClick={processGradePaste} style={{position:"absolute",bottom:6,right:6,padding:"3px 9px",fontSize:9,fontWeight:600,background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer"}}>Process</button>}
          </div>
        </div>
      </div>

      {gradingSim&&gradeResults&&(()=>{
        /* Use allPlayers (150) if available, fall back to top30 */
        const simRoster=gradingSim.allPlayers||gradingSim.top30||[];
        const simMap=buildGradeMap(simRoster);
        /* Three-pass match and rank comparison */
        const simRanked=simRoster.slice().sort((a,b)=>(b.w||0)-(a.w||0));
        const simRankById={};simRanked.forEach((p,i)=>{if(p.id)simRankById[p.id]=i+1;simRankById[normName(p.n)]=i+1;});
        const matched=[];const unmatched=[];
        gradeResults.forEach(r=>{const sp=gradeMatchPlayer(r,simMap);if(sp){const simRank=(r.pid&&simRankById[r.pid])||simRankById[normName(r.name)]||null;matched.push({name:r.name,finish:r.finish,simWin:sp.w||0,simT5:sp.t5||0,simT10:sp.t10||0,simT20:sp.t20||0,avgFinish:sp.af||null,simRank,delta:simRank?r.finish-simRank:null});}else if(r.finish<=20){unmatched.push(r);}});
        matched.sort((a,b)=>a.finish-b.finish);
        const corr=matched.length>=5?spearmanCorr(matched.map(m=>m.simWin),matched.map(m=>m.finish)):null;
        const rankCorr=matched.filter(m=>m.simRank).length>=5?spearmanCorr(matched.filter(m=>m.simRank).map(m=>m.simRank),matched.filter(m=>m.simRank).map(m=>m.finish)):null;
        /* Best calls: high sim prob + actual top finish */
        const bestCalls=matched.filter(m=>m.simWin>0.02&&m.finish<=10).sort((a,b)=>b.simWin-a.simWin).slice(0,5);
        /* Worst calls: high sim prob, bad finish */
        const worstCalls=matched.filter(m=>m.simWin>0.02&&m.finish>40).sort((a,b)=>b.simWin-a.simWin).slice(0,5);
        /* Surprises: low sim rank but top 10 finish */
        const surprises=matched.filter(m=>m.simRank&&m.simRank>30&&m.finish<=10).sort((a,b)=>a.finish-b.finish).slice(0,5);
        /* Busts: top 15 sim rank but missed cut or bottom half */
        const busts=matched.filter(m=>m.simRank&&m.simRank<=15&&m.finish>=50).sort((a,b)=>a.simRank-b.simRank).slice(0,5);
        const hitT5=matched.filter(m=>m.finish<=5).length;const simT5Mass=matched.filter(m=>m.finish<=5).reduce((s,m)=>s+m.simT5,0);
        const hitT20=matched.filter(m=>m.finish<=20).length;
        return<div style={S.section}><h3 style={S.h3}>📊 Scorecard</h3>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:8,marginBottom:14}}>
            <div style={{padding:10,background:"#0f172a",borderRadius:5,border:"1px solid #1e293b"}}><div style={{fontSize:9,color:"#64748b",textTransform:"uppercase"}}>Win% Rank Corr</div><div style={{fontSize:18,fontWeight:700,color:corr!=null&&corr<-0.3?"#22c55e":corr!=null&&corr<-0.1?"#f59e0b":"#ef4444"}}>{corr!=null?corr.toFixed(3):"—"}</div><div style={{fontSize:9,color:"#475569"}}>{corr!=null?(corr<-0.4?"Excellent":corr<-0.25?"Good":corr<-0.1?"Okay":"Weak"):""}</div></div>
            <div style={{padding:10,background:"#0f172a",borderRadius:5,border:"1px solid #1e293b"}}><div style={{fontSize:9,color:"#64748b",textTransform:"uppercase"}}>Sim→Finish Rank Corr</div><div style={{fontSize:18,fontWeight:700,color:rankCorr!=null&&rankCorr>0.3?"#22c55e":rankCorr!=null&&rankCorr>0.1?"#f59e0b":"#ef4444"}}>{rankCorr!=null?rankCorr.toFixed(3):"—"}</div></div>
            <div style={{padding:10,background:"#0f172a",borderRadius:5,border:"1px solid #1e293b"}}><div style={{fontSize:9,color:"#64748b",textTransform:"uppercase"}}>Top 5 Captured</div><div style={{fontSize:18,fontWeight:700,color:"#22d3ee"}}>{hitT5}/5</div><div style={{fontSize:9,color:"#475569"}}>Sim T5 mass: {pFmtS(simT5Mass)}</div></div>
            <div style={{padding:10,background:"#0f172a",borderRadius:5,border:"1px solid #1e293b"}}><div style={{fontSize:9,color:"#64748b",textTransform:"uppercase"}}>Matched Players</div><div style={{fontSize:18,fontWeight:700,color:"#cbd5e1"}}>{matched.length}</div><div style={{fontSize:9,color:"#475569"}}>{unmatched.length} unmatched T20</div></div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:14}}>
            {bestCalls.length>0&&<div style={{padding:10,background:"#0a2e1a",borderRadius:5,border:"1px solid #166534"}}><div style={{fontSize:10,fontWeight:700,color:"#22c55e",marginBottom:5}}>✓ BEST CALLS</div>{bestCalls.map(m=><div key={m.name} style={{fontSize:10,color:"#cbd5e1",padding:"2px 0"}}>{m.name}: {pFmtS(m.simWin)} → <b>#{m.finish}</b></div>)}</div>}
            {worstCalls.length>0&&<div style={{padding:10,background:"#1c1117",borderRadius:5,border:"1px solid #7f1d1d"}}><div style={{fontSize:10,fontWeight:700,color:"#ef4444",marginBottom:5}}>✗ WORST CALLS</div>{worstCalls.map(m=><div key={m.name} style={{fontSize:10,color:"#cbd5e1",padding:"2px 0"}}>{m.name}: {pFmtS(m.simWin)} → <b>#{m.finish}</b></div>)}</div>}
            {surprises.length>0&&<div style={{padding:10,background:"#1a1a0e",borderRadius:5,border:"1px solid #854d0e"}}><div style={{fontSize:10,fontWeight:700,color:"#f59e0b",marginBottom:5}}>⚡ SURPRISES (low sim rank, top 10)</div>{surprises.map(m=><div key={m.name} style={{fontSize:10,color:"#cbd5e1",padding:"2px 0"}}>{m.name}: sim #{m.simRank} → <b>#{m.finish}</b></div>)}</div>}
            {busts.length>0&&<div style={{padding:10,background:"#0f0f1a",borderRadius:5,border:"1px solid #3730a3"}}><div style={{fontSize:10,fontWeight:700,color:"#a78bfa",marginBottom:5}}>💤 BUSTS (top 15 sim, bottom half)</div>{busts.map(m=><div key={m.name} style={{fontSize:10,color:"#cbd5e1",padding:"2px 0"}}>{m.name}: sim #{m.simRank} → <b>#{m.finish}</b></div>)}</div>}
          </div>
          {unmatched.length>0&&<div style={{marginBottom:14,padding:10,background:"#0f172a",borderRadius:5,border:"1px solid #334155"}}><div style={{fontSize:10,fontWeight:700,color:"#94a3b8",marginBottom:5}}>⚠ UNMATCHED TOP 20 (not in sim roster)</div><div style={{fontSize:10,color:"#cbd5e1",display:"flex",flexWrap:"wrap",gap:8}}>{unmatched.slice(0,20).map(r=><span key={r.name||r.pid}>{r.name} #{r.finish}</span>)}</div></div>}
          <h3 style={S.h3}>Full Results</h3>
          <div style={S.tW}><table style={S.table}><thead><tr><th style={S.th}>Finish</th><th style={{...S.th,textAlign:"left"}}>Player</th><th style={S.th}>Sim Rank</th><th style={S.th}>Δ</th><th style={S.th}>Sim Win%</th><th style={S.th}>Sim T5%</th><th style={S.th}>Sim T20%</th><th style={S.th}>Sim Avg Pos</th></tr></thead><tbody>
            {matched.slice(0,150).map((m,i)=>(<tr key={m.name} style={i%2?S.trO:S.trE}><td style={{...S.td,fontWeight:700,color:m.finish<=5?"#22c55e":m.finish<=20?"#22d3ee":"#94a3b8"}}>{m.finish}</td><td style={S.tdN}>{m.name}</td><td style={S.td}>{m.simRank||"-"}</td><td style={{...S.td,color:m.delta==null?"#475569":m.delta>10?"#22c55e":m.delta<-10?"#ef4444":"#94a3b8"}}>{m.delta==null?"-":(m.delta>0?"+":"")+m.delta}</td><td style={S.td}>{pFmtS(m.simWin)}</td><td style={S.td}>{pFmtS(m.simT5)}</td><td style={S.td}>{pFmtS(m.simT20)}</td><td style={S.tdD}>{m.avgFinish!=null?m.avgFinish.toFixed(1):"-"}</td></tr>))}
          </tbody></table></div>
        </div>;
      })()}

      {gradeCorr&&<div style={S.section}><h3 style={S.h3}>🎯 What Actually Mattered</h3>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
          <div style={{padding:14,background:"#0f172a",borderRadius:6,border:"1px solid #1e293b"}}>
            <div style={{fontSize:12,fontWeight:700,color:"#f59e0b",marginBottom:8}}>Actual SG Importance (n={gradeCorr.n})</div>
            {gradeCorr.corrs.map(c=>(<div key={c.k} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #1e293b"}}><span style={{fontSize:11,color:"#cbd5e1"}}>{c.l}</span><div><span style={{fontSize:13,fontWeight:700,color:"#f59e0b"}}>{c.suggestedPct}%</span><span style={{fontSize:9,color:"#475569",marginLeft:6}}>r={c.corr?.toFixed(2)}</span></div></div>))}
            {gradingSim&&<div style={{marginTop:12,fontSize:10,color:"#64748b"}}><b>Your weights:</b> D:{gradingSim.sg?.dist}% Ac:{gradingSim.sg?.acc}% Ap:{gradingSim.sg?.app}% AR:{gradingSim.sg?.arg}% P:{gradingSim.sg?.putt}%</div>}
            <button onClick={()=>{const ott=gradeCorr.corrs.find(c=>c.k==="sg_ott")?.suggestedPct||25;const d=Math.round(ott*OTT_DIST_RATIO);const a=ott-d;const app=gradeCorr.corrs.find(c=>c.k==="sg_app")?.suggestedPct||25;const arg=gradeCorr.corrs.find(c=>c.k==="sg_arg")?.suggestedPct||25;const putt=gradeCorr.corrs.find(c=>c.k==="sg_putt")?.suggestedPct||25;const tot=d+a+app+arg+putt;const adj=100-tot;setSgW({dist:d,acc:a,app:app+adj,arg,putt});setTab("simulation");}} style={{...S.btnSm,marginTop:10,background:"#22c55e"}}>Apply These Weights →</button>
          </div>
          <div style={{fontSize:11,color:"#64748b",lineHeight:1.6,padding:"14px 0"}}>
            <p>These weights show which SG categories most strongly correlated with finish position at this event.</p>
            <p style={{marginTop:8}}>A higher % means that category was more predictive. Compare against the weights you used to see where your model was over/under-weighted.</p>
            <p style={{marginTop:8,color:"#475569",fontStyle:"italic"}}>"Apply These Weights" updates only SG weights, not context multipliers.</p>
          </div>
        </div></div>}

      <div style={{...S.dv,margin:"22px 0"}}/>
      <div style={S.section}><h3 style={S.h3}>💾 Backup &amp; Restore</h3>
        <div style={{fontSize:10,color:"#64748b",marginBottom:8}}>Export all local data (sim history, weights, presets, keys) as JSON. Restore on a different browser or after clearing data.</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          <button onClick={()=>{const data={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith("pga3_"))data[k]=localStorage.getItem(k);}const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="pga3_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();}} style={S.btnSm}>⬇ Export Backup</button>
          <label style={{...S.btnSm,cursor:"pointer",display:"inline-block"}}>⬆ Import Backup<input type="file" accept=".json" style={{display:"none"}} onChange={e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const data=JSON.parse(ev.target.result);let count=0;Object.entries(data).forEach(([k,v])=>{if(k.startsWith("pga3_")){localStorage.setItem(k,v);count++;}});alert("Restored "+count+" items. Reload the page to see changes.");}catch(err){alert("Import failed: "+err.message);}};r.readAsText(f);}}/></label>
        </div>
      </div>
    </div>}
  </div>);
}

const S={root:{fontFamily:"'JetBrains Mono','SF Mono',monospace",background:"#0a0e17",color:"#e2e8f0",minHeight:"100vh"},header:{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"16px 18px",borderBottom:"1px solid #1e293b",background:"linear-gradient(180deg,#0f172a,#0a0e17)"},hL:{display:"flex",alignItems:"center",gap:10},logo:{fontSize:24,color:"#22d3ee",filter:"drop-shadow(0 0 6px rgba(34,211,238,0.4))"},title:{fontSize:16,fontWeight:700,margin:0,color:"#f1f5f9"},sub:{fontSize:10,color:"#64748b",marginTop:1},badges:{display:"flex",gap:5,flexWrap:"wrap"},badge:{fontSize:9,padding:"2px 7px",borderRadius:3,background:"#1e293b",color:"#94a3b8",border:"1px solid #334155"},
tabs:{display:"flex",gap:2,padding:"5px 18px",background:"#0f172a",borderBottom:"1px solid #1e293b",overflowX:"auto"},tab:{padding:"7px 14px",fontSize:11,fontWeight:600,fontFamily:"inherit",background:"transparent",color:"#64748b",border:"none",borderRadius:4,cursor:"pointer",whiteSpace:"nowrap"},tabOn:{background:"#1e293b",color:"#22d3ee"},tabOff:{opacity:0.3,cursor:"not-allowed"},
subTabs:{display:"flex",gap:2,padding:"3px 18px 3px 36px",background:"#080c14",borderBottom:"1px solid #111827"},subTab:{padding:"4px 10px",fontSize:10,fontWeight:500,fontFamily:"inherit",background:"transparent",color:"#475569",border:"none",borderRadius:3,cursor:"pointer"},subTabOn:{background:"#1e293b",color:"#94a3b8"},
panel:{padding:"18px",maxWidth:1200,margin:"0 auto"},section:{marginBottom:24,position:"relative",zIndex:1},h2:{fontSize:14,fontWeight:700,margin:"0 0 5px",color:"#f1f5f9"},h3:{fontSize:11,fontWeight:600,margin:"0 0 6px",color:"#cbd5e1"},
row:{display:"flex",gap:6},inp:{flex:1,padding:"8px 10px",fontSize:12,fontFamily:"inherit",background:"#1e293b",color:"#e2e8f0",border:"1px solid #334155",borderRadius:4,outline:"none"},ok:{fontSize:10,color:"#22c55e",marginTop:4},err:{margin:"8px 18px",padding:"8px 12px",background:"#1c1117",border:"1px solid #7f1d1d",borderRadius:4,fontSize:11,color:"#fca5a5"},warn:{marginBottom:12,padding:"10px 14px",background:"#1a1a0e",border:"1px solid #854d0e",borderRadius:5,fontSize:11,color:"#fbbf24"},dv:{height:1,background:"#1e293b"},
btnP:{padding:"8px 16px",fontSize:11,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:4,cursor:"pointer",whiteSpace:"nowrap"},btnSm:{padding:"4px 8px",fontSize:10,fontWeight:600,fontFamily:"inherit",background:"#22d3ee",color:"#0a0e17",border:"none",borderRadius:3,cursor:"pointer",whiteSpace:"nowrap"},btnBig:{width:"100%",padding:"12px 18px",fontSize:12,fontWeight:700,fontFamily:"inherit",background:"linear-gradient(135deg,#0891b2,#22d3ee)",color:"#0a0e17",border:"none",borderRadius:6,cursor:"pointer"},btnRun:{width:"100%",padding:"14px 18px",fontSize:14,fontWeight:700,fontFamily:"inherit",background:"linear-gradient(135deg,#059669,#22c55e)",color:"#0a0e17",border:"none",borderRadius:6,cursor:"pointer"},
stRow:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 12px",background:"#0f172a",borderRadius:5},loadBar:{marginTop:12,padding:"8px 12px",background:"#0a2e1a",border:"1px solid #166534",borderRadius:5,display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:12,color:"#4ade80",fontWeight:600},
side:{background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,padding:12},slG:{marginBottom:14},slH:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:1},slL:{fontSize:12,fontWeight:600,color:"#e2e8f0"},slV:{fontSize:13,fontWeight:700,color:"#22d3ee",fontVariantNumeric:"tabular-nums",minWidth:36,textAlign:"right"},slider:{width:"100%"},
preBtn:{flex:1,padding:"4px 7px",fontSize:10,fontFamily:"inherit",background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:3,cursor:"pointer",textAlign:"left"},preDel:{padding:"2px 5px",fontSize:10,fontFamily:"inherit",background:"transparent",color:"#64748b",border:"none",cursor:"pointer"},qpBtn:{display:"block",width:"100%",padding:"6px 7px",fontSize:10,fontFamily:"inherit",background:"#1e293b",color:"#cbd5e1",border:"1px solid #334155",borderRadius:3,cursor:"pointer",textAlign:"left",marginBottom:2},empty:{fontSize:10,color:"#475569",fontStyle:"italic",padding:"4px 0"},
simBtn:{padding:"6px 12px",fontSize:11,fontWeight:500,fontFamily:"inherit",background:"#1e293b",color:"#94a3b8",border:"1px solid #334155",borderRadius:4,cursor:"pointer"},simBtnOn:{background:"#164e63",color:"#22d3ee",borderColor:"#22d3ee"},
tW:{overflowX:"auto",overflow:"auto",border:"1px solid #1e293b",borderRadius:6,position:"relative",zIndex:0},table:{width:"100%",borderCollapse:"collapse",fontSize:10,fontVariantNumeric:"tabular-nums"},th:{padding:"7px 9px",textAlign:"right",fontSize:8,fontWeight:700,color:"#64748b",textTransform:"uppercase",letterSpacing:"0.05em",borderBottom:"2px solid #1e293b",background:"#0f172a",position:"sticky",top:0,whiteSpace:"nowrap",userSelect:"none"},trE:{background:"#0a0e17"},trO:{background:"#0d1220"},td:{padding:"6px 9px",textAlign:"right",color:"#cbd5e1",borderBottom:"1px solid #111827",whiteSpace:"nowrap"},tdR:{padding:"6px 9px",textAlign:"center",color:"#475569",borderBottom:"1px solid #111827",fontSize:9,width:28},tdN:{padding:"6px 9px",textAlign:"left",color:"#f1f5f9",fontWeight:600,borderBottom:"1px solid #111827",whiteSpace:"nowrap"},tdH:{padding:"6px 9px",textAlign:"right",color:"#22d3ee",fontWeight:700,borderBottom:"1px solid #111827"},tdD:{padding:"6px 9px",textAlign:"right",color:"#475569",borderBottom:"1px solid #111827"},
hCard:{padding:"10px 12px",background:"#0f172a",border:"1px solid #1e293b",borderRadius:6,marginBottom:6},hP:{fontSize:10,color:"#94a3b8",padding:"1px 5px",background:"#1e293b",borderRadius:3}};
ReactDOM.render(<App/>,document.getElementById("root"));
</script>
